employer or client.","Mid 1 2025 Q24; Ethics Lec 3-2, Slide 3","",""],[209,"2013-61","e32","Confidentiality in the workplace ensures that investment in development would be protected and encouraged.",1,"Confidentiality protects investment in development and encourages it.","Mid 1 2025 Q25; Ethics Lec 3-2, Slides 9-12","",""],[210,"2013-62","e32","There is no difference between preserving confidentiality and hiding misdeeds.",0,"Confidentiality protects legitimate secrets. Hiding misdeeds such as crimes or hazards is never allowed.","Mid 1 2025 Q25; Ethics Lec 3-2, Slides 9-12","","t"],[211,"2013-63","e32","Moonlighting is a form of conflict of interest.",1,"Moonlighting, such as working for a competitor or supplier in spare time, is a form of conflict of interest.","Mid 1 2025 Q24; Ethics Lec 3-2, Slides 3-8","",""],[212,"2013-64","e32","In special types of industries, like aviation and nuclear industries, it is allowed to hire industry experts as regulators.",1,"In special industries such as aviation and nuclear, hiring industry experts as regulators is allowed because the expertise is rare.","Mid 1 2025 Q24; Ethics Lec 3-2, Slides 3-8","",""],[213,"2013-66","e32","An engineer can use insider information of another corporation for the benefit of his own company.",0,"Using another corporation’s insider information for your own company’s benefit is a conflict of interest and is not allowed.","Mid 1 2025 Q24; Ethics Lec 3-2, Slides 3-8","",""],[214,"2013-69","e32","Whistleblowing occurs when a former employee conveys information about a significant moral problem to anyone and does so outside approved organizational channels.",0,"The information must go to someone in a position to take action, not to “anyone”.","Q69; Ethics Lec 3-2, Slide 14","","t"],[215,"2013-70","e32","When a manager denies the salary increase of an engineer, the engineer may follow the whistleblowing process.",0,"Whistleblowing is for serious moral problems and public safety, not for personal pay disputes.","Q70; Ethics Lec 3-2","",""],[216,"2013-71","e32","Complaining to another manager in the engineering corporation [outside normal channels] is not considered as whistleblowing.",0,"Complaining to another manager outside the normal channels is internal whistleblowing, so it does count as whistleblowing.","Q71; Mid 1 2025 Q28; Ethics Lec 3-2, Slide 15","","t"],[217,"2013-72","e32","Protecting whistleblowers is the responsibility of managers only.",0,"Protecting whistleblowers is the responsibility of society, the law and the public, not managers only.","Mid 1 2025 Q26; Ethics Lec 3-2, Slides 14-23","",""],[218,"2013-73","e32","An engineer should report any wrongdoings practiced by his company only after he retires.",0,"Whistleblowing should be prompt. Waiting until retirement lets the harm happen.","Ethics Lec 3-2, Slide 20","",""],[219,"2013-74","e32","When whistleblowing, we should be careful not to hurt others' feelings as much as we can [be tactful and focus on issues, not personal attacks].",1,"When whistleblowing, be tactful, focus on the issues and avoid personal attacks.","Mid 1 2025 Q26; Ethics Lec 3-2, Slides 14-23","",""],[220,"2013-75","e32","The public should pay attention to the whistleblower even if his motives are not right.",1,"The public should pay attention to the whistleblower’s message even if his motives are not pure, because the safety issue is what matters.","Mid 1 2025 Q26; Ethics Lec 3-2, Slides 14-23","",""],[221,"2013-76","e32","An engineer should document all his official correspondence with his managers in order to be able to defend himself in case they blamed him for something he did not do.",1,"Documenting official correspondence with managers protects the engineer if he is later blamed unfairly.","Mid 1 2025 Q26; Ethics Lec 3-2, Slides 14-23","",""],[222,"2025-E20","e4","When communicating with the public about project safety (Risk Communication), engineers must consider both technical facts AND psychological/cultural factors affecting public risk perception.",1,"Risk communication must combine the technical facts with the psychological and cultural factors that shape how the public perceives risk.","Mid 1 2025 Q15; Spring 2019 Q11; Ethics Lec 4","Mid 1 2025 Q15 | Spring 2019 Q11","s"],[223,"P1-49","e4","The limited number of lifeboats in Titanic was not ethical engineering practice but it was legal engineering practice.",1,"Titanic’s lifeboat count met the outdated legal minimum, so it was legal. It was far too few for the passengers, so it was unethical and unsafe.","Mid 1 2025 Q16; Ethics Lec 4, Slides 24-25","","s"],[224,"P1-60","e4","Applying cost-benefit analysis in environmental impact assessment ensures that all necessary actions are taken care of regardless of their costs.",0,"Cost-benefit analysis turns everything into money and may skip necessary actions that cost too much. Risk-benefit analysis is the tool for fair distribution of risks.","Mid 1 2025 Q17; Ethics Lec 4, Slides 22-23","","st"],[225,"P1-64","e4","In a cost-benefit analysis we tend to maximize the safety and health of the public.",0,"Cost-benefit analysis maximizes economic profit, not public safety and health.","Mid 1 2025 Q17; Ethics Lec 4, Slides 22-23","","st"],[226,"S4-1","e4","The distinction between what is safe and what is not is agreed upon from all people and can be easily done.",0,"Safety is subjective. People disagree about how safe is safe enough.","Mid 1 2025 Q12; Ethics Lec 4, Slide 8","",""],[227,"S4-2","e4","Whether the risk is accepted [voluntarily] does change how the people at risk are willing to accept it.",1,"Voluntariness changes risk acceptance, because people accept voluntary risks more readily.","Mid 1 2025 Q14; Ethics Lec 4, Slides 13-15","",""],[228,"S4-3","e4","Whether the effects of a risky activity or situation are immediately noticeable or are close at hand does not affect how the people at risk accept it.",0,"Immediacy does affect acceptance. Risks whose effects are delayed are easier to accept than immediate ones.","Mid 1 2025 Q14; Ethics Lec 4, Slides 13-15","",""],[229,"S4-4","e4","People are generally more willing to accept risk if it is caused by their own decisions.",1,"People accept a risk more readily when it comes from their own decisions.","Ethics Lec 4","",""],[230,"S4-5","e4","The manner in which information necessary for decision making is presented does not influence how risks are perceived.",0,"How information is presented does influence how risks are perceived.","Mid 1 2025 Q14; Ethics Lec 4, Slides 13-15","",""],[231,"S4-6","e4","Our reaction to risk is affected by the dread of a possible mishap, both in terms of its magnitude and of the personal identification or relationship we may have with the potential victims.",1,"Dread of a possible mishap, its size and how personally we identify with the victims all shape our reaction to risk.","Mid 1 2025 Q14; Ethics Lec 4, Slides 13-15","",""],[232,"S4-7","e4","Any improvement in safety as it relates to an engineered product is often accompanied by an increase in the cost of that product.",1,"More safety usually raises the primary (production) cost of a product.","Ethics Lec 4, Slide 19","",""],[233,"S4-8","e4","Products that are not safe incur secondary costs to the manufacturer beyond the primary (production) costs that must also be taken into account.",1,"An unsafe product brings secondary costs such as lawsuits, compensation and lost reputation, on top of the primary cost.","Ethics Lec 4, Slide 19","",""],[234,"S4-9","e4","Risk is the potential that something unwanted and harmful may occur.",1,"Risk is the potential that something unwanted and harmful may occur.","Ethics Lec 4","",""],[235,"S4-10","e4","Risk perception factor defines whether the risk is assumed voluntarily, how the probabilities of harm or benefit are presented, job-related or other pressures, magnitude, and proximity.",1,"Risk perception depends on voluntariness, how probabilities are presented, job-related or other pressures, magnitude and proximity.","Mid 1 2025 Q14; Ethics Lec 4, Slides 13-15","",""],[236,"S4-11","e4","Risk-benefit analysis studies determining the risks, the benefits, and whether the project or product is worth the risks connected with its use.",1,"Risk-benefit analysis studies the risks, the benefits, and whether a project is worth the risks of its use.","Mid 1 2025 Q17; Ethics Lec 4, Slides 22-23","",""],[237,"S4-12","e4","Cost-effectiveness [Cost-benefit] analysis studies which design has the greatest merit.",1,"Cost-effectiveness analysis compares alternative designs to find which one has the greatest merit for the cost.","Mid 1 2025 Q17; Ethics Lec 4, Slides 22-23","",""],[238,"S4-13","e4","Safe exits consist of design and procedures ensuring that if a product fails it will fail safely and the user can safely escape the product.",1,"A safe exit means that if a product fails it fails safely and the user can escape or avoid harm.","Mid 1 2025 Q16; Ethics Lec 4, Slides 24-25","",""],[239,"S3-16","e4","Safe exits means design and procedures ensuring that if a product fails it will fail after the end of the warranty period.",0,"Safe exits mean failing safely and protecting the user, not failing after the warranty ends.","Mid 1 2025 Q16; Ethics Lec 4, Slides 24-25","","t"],[240,"S3-17","e4","Safe exits: Design and procedures ensuring that if a product fails it will fail safely and the user can safely avoid harm from the failed product.",1,"A safe exit means the product fails safely and the user can avoid harm from the failed product.","Mid 1 2025 Q16; Ethics Lec 4, Slides 24-25","",""],[241,"2014-21","e4","People usually agree on when an engineering product is safe enough.",0,"Safety is subjective, so people usually do not agree on when a product is safe enough.","Ethics Lec 4","",""],[242,"2014-22","e4","Absolute safety is an easily achieved goal.",0,"Absolute safety is impossible and extremely costly, so it is not easily achieved.","Mid 1 2025 Q12; Ethics Lec 4, Slide 8","",""],[243,"2014-23","e4","A thing is safe if, were its risks fully known, it would be judged acceptable by a reasonable person in light of their settled value principles.",1,"This is the Martin and Schinzinger definition: a thing is safe if, with its risks fully known, a reasonable person would find it acceptable.","Ethics Lec 4, Slide 5","",""],[244,"2014-25","e4","Ethically, even if the code of practice for a certain engineering job does not require certain safety measures, an engineer should do his best to apply the best safety measures he is familiar with.",1,"Codes of practice set only the minimum. An ethical engineer applies the best safety measures he knows.","Spring 2019 Q40; Ethics Lec 4","",""],[245,"2014-50","e4","Cost-benefit analysis considers the cost and benefits to everyone affected by a project or proposal.",0,"That describes risk-benefit analysis. Cost-benefit analysis converts everything to money to maximize company profit.","Mid 1 2025 Q17; Ethics Lec 4, Slides 22-23","","t"],[246,"2014-70","e4","A risk is the potential that something unwanted and harmful may occur.",1,"Risk is the potential that something unwanted and harmful may occur.","Ethics Lec 4","",""],[247,"2014-71","e4","Technological risk includes dangers of bodily harm, of economic loss, or of environmental degradation.",1,"Technological risk covers bodily harm, economic loss and environmental degradation.","Mid 1 2025 Q13; Ethics Lec 4, Slide 11","",""],[248,"2014-72","e4","Involuntary risks are usually accepted by the public compared with voluntary risk.",0,"People accept voluntary risks more readily than involuntary ones.","Mid 1 2025 Q14; Ethics Lec 4, Slides 13-15","",""],[249,"2014-73","e4","It is not the responsibility of the engineer if the workers under his supervision do not stick to the safety rules as long as he did his best to educate them.",0,"The engineer is responsible for enforcing safety rules on site, not only for teaching them in theory.","Q73; Ethics Lec 4","",""],[250,"2013-1","e4","Higher safety usually means a higher product's price.",1,"Higher safety usually means a higher price for the product.","Ethics Lec 4, Slide 19","",""],[251,"2013-2","e4","A risk-free product is hard to achieve.",1,"A risk-free product is hard to achieve.","Mid 1 2025 Q12; Ethics Lec 4, Slide 8","",""],[252,"2013-3","e4","Safety has the same meaning for different persons.",0,"Safety is subjective, so it has different meanings for different people.","Mid 1 2025 Q12; Ethics Lec 4, Slide 8","",""],[253,"2013-4","e4","By definition: A thing is safe if, were its benefits fully known, it would be judged acceptable by a reasonable person in light of their settled value principles.",0,"One word was changed. The definition says that with its RISKS fully known, not its benefits.","Q4; Ethics Lec 4, Slide 5","","t"],[254,"2013-5","e4","By definition: A risk is the assurance that something unwanted and harmful may occur.",0,"Risk is only a potential, not an assurance. The word “assurance” makes it false.","Q5; Ethics Lec 4, Slide 11","","t"],[255,"2013-6","e4","Technological risk is limited to dangers of bodily damage.",0,"Technological risk is not limited to bodily damage. It also includes economic loss and environmental damage.","Mid 1 2025 Q13; Ethics Lec 4, Slide 11","",""],[256,"2013-7","e4","Usually, people accept risks that they are voluntarily exposed to.",1,"People usually accept risks they are exposed to voluntarily.","Mid 1 2025 Q14; Ethics Lec 4, Slides 13-15","",""],[257,"2013-8","e4","If victims are known [identifiable], the perception of risks is usually high.",1,"When the victims are known and identifiable, the perception of risk is usually high.","Mid 1 2025 Q14; Ethics Lec 4, Slides 13-15","",""],[258,"2013-9","e4","Maximum allowable concentrations of toxic materials are higher for the public than the workers dealing with these materials.",0,"The allowed concentration for the public is lower (stricter) than for workers, who are medically monitored.","Q9; Ethics Lec 4","","t"],[259,"2013-10","e4","A future risk is usually harder to accept than an immediate risk.",0,"A delayed risk is easier to accept than an immediate one.","Mid 1 2025 Q14; Ethics Lec 4, Slides 13-15","",""],[260,"2013-11","e4","Job-related risks are more easily accepted than involuntary risks.",1,"Job-related risks are accepted more easily than involuntary risks.","Mid 1 2025 Q14; Ethics Lec 4, Slides 13-15","",""],[261,"2013-12","e4","The primary [manufacturing] cost of a high-risk product is usually high.",0,"A high-risk product usually has a low primary cost and a high secondary cost.","Ethics Lec 4, Slide 19","","t"],[262,"2013-13","e4","The secondary [warranty/litigation] cost of a low-risk product is usually high.",0,"A low-risk product has low secondary costs. The big secondary costs come from unsafe products.","Ethics Lec 4, Slide 19","","t"],[263,"2013-14","e4","Usually legal settlements with nondisclosure conditions result in better knowledge of safety.",0,"Nondisclosure settlements hide safety lessons from other engineers and the public, so they do not improve safety knowledge.","Q14, Q15; Ethics Lec 4, Slide 21","",""],[264,"2013-15","e4","Risk is usually [intentionally] designed into a product.",0,"Risks are not intentionally designed into a product.","Q14, Q15; Ethics Lec 4, Slide 21","",""],[265,"2013-16","e4","The concept of safety factor in the product design is usually used more than the safety margin.",1,"The safety factor is used in design more than the safety margin.","Q16-18; Ethics Lec 4, Slide 20","",""],[266,"2013-17","e4","If the engineer tests the properties of a steel bar, he should always get the exact same mechanical properties that are indicated in the specification sheets.",0,"Material properties follow a statistical distribution, so tests never give exactly the same value as the specification sheet.","Q16-18; Ethics Lec 4, Slide 20","",""],[267,"2013-18","e4","A thing is safe if its capability exceeds its duty.",1,"A thing is safe if its capability exceeds its duty.","Q16-18; Ethics Lec 4, Slide 20","",""],[268,"2013-19","e4","By definition: risk-benefit [safety-benefits] analysis is a study determining the risks, the benefits, and whether the project or product is worth the risks associated with its use.",1,"Risk-benefit analysis studies the risks, the benefits and whether the project is worth the risks of its use.","Mid 1 2025 Q17; Ethics Lec 4, Slides 22-23","",""],[269,"2013-20","e4","If we would like to maximize the benefits of a project, we should carry out cost-effectiveness analysis rather than cost-benefit analysis.",0,"Cost-benefit analysis is the tool for weighing a project’s benefits. Cost-effectiveness compares designs for a fixed goal, so this swap is false.","Ethics Lec 4, Slides 22-23","",""],[270,"2013-21","e4","The private value system and the societal value system as related to risk are usually the same.",0,"The private value system and the societal value system usually differ about risk.","Ethics Lec 4","",""],[271,"2013-22","e4","Unfair distribution of risks is usually cited when local people object to building a nuclear power or a petrochemical plant.",1,"Local people object to nuclear or petrochemical plants because the risks and benefits are distributed unfairly.","Ethics Lec 4","",""],[272,"2013-23","e4","Using a parachute in a jet fighter is considered part of the safe exit concept.",1,"A parachute in a jet fighter is a classic safe exit, letting the pilot escape a failing aircraft.","Mid 1 2025 Q16; Ethics Lec 4, Slides 24-25","",""],[273,"2013-24","e4","Emergency procedures are usually technical issues that have nothing to do with human factors.",0,"Emergency procedures involve human factors, not only technical issues.","Mid 1 2025 Q16; Ethics Lec 4, Slides 24-25","",""],[274,"2013-35","e4","Applying Cost-Benefit Analysis in environmental impact assessment ensures that all necessary actions are taken care of regardless of their costs.",0,"Cost-benefit analysis turns everything into money, so it does not guarantee that every necessary action is taken regardless of cost.","Mid 1 2025 Q17; Ethics Lec 4, Slides 22-23","","t"],[275,"2025-E21","e5","Ethical theories are attempts to provide clarity and consistency, systematic and comprehensive understanding, and helpful practical guidance in moral matters.",1,"Ethical theories give clarity and consistency, systematic understanding, and practical guidance in moral matters.","Mid 1 2025 Q35; Ethics Lec 5, Slide 2","Mid 1 2025 Q35","s"],[276,"2025-E22","e5","Virtue ethics and Self-realization ethics are 'mirror images of each other,' and compensation motives (money/social rewards) should NOT be among an engineer's motives.",0,"The mirror images are Rights Ethics and Duty Ethics. Compensation, such as money and social reward, is a legitimate motive for engineers.","Mid 1 2025 Q33, Q34; Ethics Lec 5","Mid 1 2025 Q33 & Q34","st"],[277,"M45-20","e5","The right of ethics theory stresses the importance of the rights of engineers.",0,"Corrected key: False. Rights ethics stresses the human rights of the public, not special rights for engineers.","Mid 1 2025 Q30; Ethics Lec 5, Slide 10","","wt"],[278,"M45-21","e5","The duty ethics theory stresses the importance of the duties of the managers of the engineering companies.",0,"Corrected key: False. Duty ethics stresses the duties of engineers and all moral agents toward the public, not only managers.","Ethics Lec 5, Slide 12","","wt"],[279,"M45-29","e5","Act-utilitarianism requires corporations to inform public of dangers.",0,"Rule-utilitarianism requires always informing the public of dangers. Act-utilitarianism judges case by case and could justify hiding a danger.","Mid 1 2025 Q31; Ethics Lec 5, Slide 9","","t"],[280,"M45-30","e5","Religious beliefs of an engineer could be a problem in promoting morally responsible conduct.",0,"Religious commitment supports morally responsible conduct. It is not an obstacle.","Ethics Lec 5, Slides 19-20","",""],[281,"M45-31","e5","In the right ethics theory, it is accepted from an engineer to develop a firewall for the internet users.",1,"Corrected key: True. A firewall protects users’ rights to privacy and security, which fits Rights Ethics.","Ethics Lec 5, Slide 10","","w"],[282,"M45-33","e5","In the duty ethic theory, it is needed from an engineer to develop a safe product.",1,"Corrected key: True. Duty ethics says an engineer must develop a safe product, because of the duty not to harm.","Ethics Lec 5, Slide 12","","w"],[283,"P1-52","e5","Engineering ethics is affected by the culture of the society as well as the religious commitment of its members.",1,"Engineering ethics is shaped by the culture of society and by the religious commitment of its members.","Ethics Lec 5, Slides 19-22","","s"],[284,"P1-67","e5","Legal rights are larger in number than human rights.",0,"Human rights are broader and larger than local legal rights, so legal rights are not larger in number.","Ethics Lec 5, Slide 11","","st"],[285,"P1-68","e5","Stewardship ensures that engineers would develop a product that is in harmony with the environment.",1,"Stewardship, the duty to care for the environment, leads engineers to design products in harmony with it.","Ethics Lec 5, Slides 19-22","","s"],[286,"P1-69","e5","If students from two different engineering programs participate in one graduation project, this will enhance their environmental awareness.",1,"Joint projects between two different engineering programs widen students’ environmental and ethical awareness.","Ethics Lec 5, Slides 19-22","","s"],[287,"P1-72","e5","Engineering ethics are usually not affected by the society culture and the religious commitment of its members.",0,"Engineering ethics is affected by the culture of the society and the religious commitment of its members, so “usually not affected” is false.","Ethics Lec 5, Slides 19-22","","s"],[288,"P1-82","e5","Moral theories contradict.",0,"Corrected key: False. Moral theories complement each other and do not contradict.","Ethics Lec 5, Slide 24; Mid 1 2025 Q32","","wt"],[289,"2014-51","e5","Students who study engineering are motivated by a desire for interesting and challenging work.",1,"Engineers are motivated by proficiency (interesting and challenging work), compensation and moral concern. All three are legitimate motives.","Mid 1 2025 Q34; Ethics Lec 5, Slide 17","",""],[290,"2014-52","e5","Religious beliefs and spiritual attitudes are especially important personal commitments relevant to all aspects of the lives of engineers, including their professions.",1,"Religious beliefs and spiritual attitudes are important personal commitments that touch all aspects of an engineer’s life and profession.","Ethics Lec 5, Slides 19-22","",""],[291,"2014-54","e5","Engineering ethics is a universal issue, not a society (cultural) related issue.",0,"Engineering ethics is universal, but it is also shaped by each society’s culture, so the “not cultural” part is false.","Ethics Lec 5, Slides 19-22","",""],[292,"2013-28","e5","Engineering ethics may be enhanced by the culture of the society and the religious commitment of its members.",1,"Engineering ethics can be strengthened by the culture of society and the religious commitment of its members.","Ethics Lec 5, Slides 19-22","",""],[293,"2013-34","e5","For the engineers, the duty ethics theory stresses the importance of their duties toward the public.",1,"Duty ethics stresses the engineer’s duties toward the public.","Ethics Lec 5, Slides 12-13","",""],[294,"2013-36","e5","Legal rights are larger in number than human rights.",0,"Human rights are broader than legal rights, so legal rights are not larger in number.","Ethics Lec 5, Slide 11","","t"],[295,"2025-E23","std","Engineering laws and standards set the rules for MAXIMAL compliance rather than minimal compliance.",0,"Engineering laws and standards set the rules for MINIMAL compliance. Excellence goes beyond them.","Fall 2023 Q12; Gamal Q39; Tier 3 Standards","Fall 2023 Q12 | Gamal Q39","st"],[296,"2025-E24","std","Developing an industrial standard takes only a few months, requires 100% unanimous voting, and descriptive standards encourage innovation more than performance standards.",0,"Developing a standard takes several years of drafting and consensus balloting, not a few months. It needs a substantial majority, not 100%, and performance standards encourage innovation more than descriptive ones.","Fall 2023 Q6, Q7; Spring 2019 Q4","Fall 2023 Q6 & Q7 | Spring 2019 Q4","st"],[297,"2025-E25","std","A main function of a regulatory body is to uphold public confidence, and to avoid conflict of interest it should NOT be controlled by the Ministry of Industry that promotes corporate profits.",1,"A regulator upholds public confidence. To avoid conflict of interest it should not be controlled by the Ministry of Industry, which promotes corporate profit.","Fall 2023 Q3, Q13; Gamal Q24, Q30","Fall 2023 Q3 & Q13 | Gamal Q24 & Q30","s"],[298,"P1-50","std","Industrial standards can benefit manufacturers only.",0,"Industrial standards benefit manufacturers, customers, engineers and the public alike.","Spring 2019 Q1","","s"],[299,"P1-51","std","Industrial standards tend to increase production cost.",0,"Standardization lowers production cost and makes parts interchangeable.","Spring 2019 Q2; 2013 Q27","","s"],[300,"S3-12","std","There is one area in which industry usually welcomes greater specificity, and that is in regard to standards.",1,"Industry usually welcomes greater specificity in one area: standards.","Sheet 3 Q12","",""],[301,"S3-13","std","Standards are established by professional associations and trade associations for in-house use.",0,"Standards set by professional and trade associations are meant for general public use, not only in-house use.","Sheet 3 Q13","",""],[302,"S3-14","std","Standards may be prescribed as parts of laws and official regulations.",1,"Standards may be prescribed as part of laws and official regulations. A technical standard becomes a code when the authorities adopt it into law.","Sheet 3 Q14; Mid 2 2025 Q16","",""],[303,"2014-53","std","It is not ethical that special interests (manufacturers, trade unions, exporters, importers) manage to impose unnecessary provisions or remove important provisions from engineering standards.",1,"It is unethical for special interests to impose unnecessary provisions on a standard or remove important ones.","2014 Q53","",""],[304,"2013-27","std","Industrial standards tend to increase production costs.",0,"Standardization lowers production cost and makes parts interchangeable, so standards do not increase costs.","Spring 2019 Q2; 2013 Q27","",""],[305,"S5-1","loy","Agency loyalty is acting to fulfill one's contractual duties to an employer.",1,"Agency loyalty means acting to fulfill one’s contractual duties to an employer.","Sheet 5 Q1; 2013 Q45","",""],[306,"S5-2","loy","Attitude [Attribute] loyalty has as much to do with attitudes, emotions, and a sense of personal identity as it does with actions.",1,"Attitude loyalty is as much about attitudes, emotions and a sense of identity as about actions.","Sheet 5 Q2, Q3","",""],[307,"S5-3","loy","Attitude-loyalty is often a virtue but not strictly an obligation.",1,"Attitude loyalty is often a virtue but not strictly an obligation.","Sheet 5 Q2, Q3","",""],[308,"S5-13","loy","Collegiality is a virtue of teamwork that includes respect for colleagues and commitment to the moral ideals inherent in one's profession.",1,"Collegiality is a virtue of teamwork. It includes respect for colleagues and commitment to the moral ideals of the profession.","Sheet 5 Q13; 2014 Q46","",""],[309,"2014-9","loy","Attitude loyalty means acting to fulfill one's contractual duties to an employer.",0,"Swapped definitions. Acting to fulfill contractual duties is agency loyalty. Attitude loyalty is a virtue, not a contractual duty.","2014 Q9-11","","t"],[310,"2014-10","loy","Agency loyalty means seeking to meet one's moral duties to a group or organization willingly, with personal attachment and affirmation, and with a reasonable degree of trust.",0,"Swapped definitions. Willing attachment and affirmation describes attitude loyalty. Agency loyalty is about contractual duties.","2014 Q9-11","","t"],[311,"2014-11","loy","Attitude loyalty is an obligation within proper limits.",0,"Attitude loyalty is a virtue, not strictly an obligation. Agency loyalty is the obligation.","2014 Q9-11","","t"],[312,"2014-46","loy","Respect for colleagues, valuing their professional expertise and their devotion for the social goods promoted by the profession are all facets of collegiality.",1,"Respect for colleagues, valuing their expertise and sharing their devotion to the profession’s social goods are all facets of collegiality.","Sheet 5 Q13; 2014 Q46","",""],[313,"2013-45","loy","Agency loyalty usually focuses on one's contractual duties.",1,"Agency loyalty usually focuses on one’s contractual duties.","Sheet 5 Q1; 2013 Q45","",""],[314,"2013-46","loy","Collegiality in the work environment requires an engineer to value the participation of his colleagues in the syndicate activities.",1,"Collegiality means valuing colleagues’ participation in activities such as the syndicate’s.","Sheet 5 Q13; 2013 Q46","",""],[315,"S5-4","loy","Executive authority is the corporate or institutional right given to a person to exercise power based on the resources of an organization.",1,"Executive authority is the right, given by an institution, to exercise power based on the organization’s resources.","Sheet 5 Q4; 2014 Q48","",""],[316,"S5-5","loy","'Engineer-oriented companies' make profit the primary focus.",0,"Engineer-oriented companies put quality and safety first. Finance-oriented ones focus on profit.","Sheet 5 Q5-7; 2014 Q17; 2013 Q52","",""],[317,"S5-6","loy","'Customer-oriented companies' make their priority the satisfaction of customers.",1,"Customer-oriented companies make customer satisfaction their priority.","Sheet 5 Q5-7; 2014 Q17; 2013 Q52","",""],[318,"S5-7","loy","'Finance-oriented companies' focus primarily on the quality of products.",0,"Finance-oriented companies focus on profit. Engineer-oriented companies focus on product quality and safety.","Sheet 5 Q5-7; 2014 Q17; 2013 Q52","","t"],[319,"2014-4","loy","Ethically, it is not the responsibility of the corporation to provide their engineers with necessary tools to perform their professional duties.",0,"An ethical corporation should give its engineers the tools they need to do their professional duties.","Q4-8; 2013 Q40-44; 2014 Q47-48","",""],[320,"2014-5","loy","Respect for authority contradicts the essence of teamwork.",0,"Respect for authority does not contradict teamwork. It is part of working as a team.","Q4-8; 2013 Q40-44; 2014 Q47-48","",""],[321,"2014-6","loy","Ethical corporate climate means a working environment that is conducive to morally responsible conduct.",1,"An ethical corporate climate is a working environment that encourages morally responsible conduct.","Q4-8; 2013 Q40-44; 2014 Q47-48","",""],[322,"2014-7","loy","Profit seeking is not ethical in ethical corporations.",0,"Seeking profit is acceptable in ethical corporations, as long as it does not conflict with ethics.","Q4-8; 2013 Q40-44; 2014 Q47-48","",""],[323,"2014-8","loy","Practicing social responsibility from corporations is one of the evidences that they are ethical.",1,"Practicing social responsibility is one of the signs that a corporation is ethical.","Q4-8; 2013 Q40-44; 2014 Q47-48","",""],[324,"2014-17","loy","In customer-oriented companies, safety is not important at all.",0,"Safety matters in every company, including customer-oriented ones.","Sheet 5 Q5-7; 2014 Q17","",""],[325,"2014-47","loy","Engineers and managers have the same roles but different authority.",0,"Engineers and managers have different roles and different authority, and both are valuab /* ---------- app ---------- */
const GROUPS={bm:'Business & Marketing',e1:'Ethics 1 · Profession',e2:'Ethics 2 · Life cycle & dilemmas',e31:'Ethics 3-1 · Social experiment',e32:'Ethics 3-2 · Conflict & whistleblowing',e4:'Ethics 4 · Safety & risk',e5:'Ethics 5 · Moral theories',std:'Standards & regulators',loy:'Loyalty, authority & conflict'};
const GORDER=['bm','e1','e2','e31','e32','e4','e5','std','loy'];
const QBY={};
Q.forEach(a=>{QBY[a[0]]={id:a[0],code:a[1],g:a[2],t:a[3],a:a[4],e:a[5],r:a[6],s:a[7],f:a[8]}});
const NEX=8,REP={5:288,6:279,7:277,8:172};
const EXAMS={};
for(let n=1;n<=NEX;n++){
  const l=Q.filter(a=>(a[0]-1)%NEX===n-1).map(a=>({id:a[0],rep:false}));
  if(REP[n])l.push({id:REP[n],rep:true});
  l.sort((x,y)=>x.id-y.id);EXAMS[n]=l;
}
const TOTAL=45;
const KEY='hum71-bank-v1';
let store={theme:null,hints:true,exams:{}};
try{const r=localStorage.getItem(KEY);if(r){const p=JSON.parse(r);if(p&&typeof p==='object')store=Object.assign(store,p)}}catch(e){}
if(!store.exams||typeof store.exams!=='object')store.exams={};
function save(){try{localStorage.setItem(KEY,JSON.stringify(store))}catch(e){}}
function ex(n){return store.exams[n]||(store.exams[n]={ans:{},done:false,best:null,cur:0})}

const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const svg=(p,w)=>'<svg viewBox="0 0 24 24" width="'+(w||18)+'" height="'+(w||18)+'" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+p+'</svg>';
const ICON={
  sun:svg('<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',20),
  moon:svg('<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>',20),
  ok:svg('<path d="M5 12.5l4.5 4.5L19 7.5"/>'),
  no:svg('<path d="M6 6l12 12M18 6L6 18"/>'),
  back:svg('<path d="M15 5l-7 7 7 7"/>',16),
  next:svg('<path d="M9 5l7 7-7 7"/>',16),
  dash:svg('<path d="M6 12h12"/>')
};

/* theme */
function isDark(){const t=document.documentElement.getAttribute('data-theme');if(t)return t==='dark';return matchMedia('(prefers-color-scheme: dark)').matches}
function applyTheme(){if(store.theme)document.documentElement.setAttribute('data-theme',store.theme)}
function themeBtn(){const b=$('#theme'),d=isDark();b.innerHTML=d?ICON.sun:ICON.moon;b.setAttribute('aria-label',d?'Switch to light mode':'Switch to dark mode');b.title=d?'Light mode':'Dark mode'}
$('#theme').addEventListener('click',()=>{store.theme=isDark()?'light':'dark';applyTheme();save();themeBtn()});
try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',themeBtn)}catch(e){}
applyTheme();themeBtn();

/* helpers */
const qAt=(n,i)=>QBY[EXAMS[n][i].id];
function answered(n){return Object.keys(ex(n).ans).length}
function score(n){const s=ex(n);let c=0;EXAMS[n].forEach((it,i)=>{if(s.ans[i]===QBY[it.id].a)c++});return c}
function mix(n){let b=0,e=0,o=0;EXAMS[n].forEach(it=>{const g=QBY[it.id].g;if(g==='bm')b++;else if(g[0]==='e')e++;else o++});return {b:b,e:e,o:o}}
const ABS=/\b(only|always|never|all|any|anyone|nothing|solely|completely|entirely|regardless|immediately|obvious|obviously|easily|cannot|must|every|everything|none|nobody|zero|no limitations|identical|exactly|purely)\b/gi;
function stmt(t){const s=esc(t);return store.hints?s.replace(ABS,'<mark class="abs">$1</mark>'):s}
function pad(n){return n<10?'0'+n:''+n}
let pendingRestart=0,confirmFinish=false,mapOpen=false,filter='wrong',activeN=0;

/* ---------- home ---------- */
function home(){
  activeN=0;
  let all=0;for(let n=1;n<=NEX;n++)all+=answered(n);
  const allT=NEX*TOTAL;
  const rows=[];
  for(let n=1;n<=NEX;n++){
    const s=ex(n),k=answered(n),status=s.done?'done':(k?'prog':'new'),m=mix(n);
    const pill=status==='done'?'<span class="pill done">Finished</span>':status==='prog'?'<span class="pill prog">In progress</span>':'<span class="pill">Not started</span>';
    let bub='';
    for(let i=0;i<TOTAL;i++){const v=s.ans[i];bub+='<i class="'+(v===undefined?'':(v===qAt(n,i).a?'ok':'no'))+'"></i>'}
    let note='Statements from every lecture, in lecture order.';
    if(REP[n])note='Includes 1 priority repeat from the corrections list.';
    if(status==='prog')note=k+' of '+TOTAL+' answered, '+score(n)+' correct so far.';
    if(status==='done')note='Last score '+score(n)+' / '+TOTAL+(s.best!=null?'. Best '+s.best+' / '+TOTAL+'.':'.');
    let acts='';
    const rst=pendingRestart===n?'<button class="btn danger" type="button" data-act="restart-go" data-n="'+n+'">Erase and '+(status==='done'?'retake':'restart')+'</button>':'<button class="btn ghost" type="button" data-act="restart" data-n="'+n+'">'+(status==='done'?'Retake':'Restart')+'</button>';
    if(status==='new')acts='<button class="btn primary" type="button" data-act="open" data-n="'+n+'">Start</button>';
    if(status==='prog')acts='<button class="btn primary" type="button" data-act="open" data-n="'+n+'">Continue</button>'+rst;
    if(status==='done')acts='<button class="btn primary" type="button" data-act="results" data-n="'+n+'">Results</button>'+rst;
    rows.push('<article class="row"><div class="num" aria-hidden="true">'+pad(n)+'</div><div class="row-main"><div class="row-title"><h3>Exam '+n+'</h3>'+pill+'</div>'+
      '<p class="meta">'+TOTAL+' statements · '+m.b+' business · '+m.e+' ethics · '+m.o+' other</p>'+
      '<div class="omr" role="img" aria-label="'+k+' of '+TOTAL+' answered">'+bub+'</div><p class="note">'+note+'</p></div><div class="row-act">'+acts+'</div></article>');
  }
  $('#app').innerHTML=
    '<section><div class="eyebrow">Alexandria University · SSP · Fall 2026</div>'+
    '<h1>Eight exams.<br><em>356</em> statements.</h1>'+
    '<p class="lede">Every true or false statement from the master question bank, split into eight exams of 45. Choose an exam, answer, and read why straight away.</p>'+
    '<div class="cover"><div class="cover-h"><span>Answered across all exams</span><b>'+all+' / '+allT+'</b></div><div class="meter" role="img" aria-label="'+all+' of '+allT+' answered"><i style="width:'+(all/allT*100)+'%"></i></div></div></section>'+
    '<h2 class="sec-h">Choose an exam</h2><div class="rows">'+rows.join('')+'</div>'+
    '<div class="foot"><p>Every exam mixes all nine topics: Business and Marketing, Ethics lectures 1 to 5, standards, and loyalty, authority and conflict styles. Statements marked “High-yield” are ones past exams repeated.</p>'+
    '<p>356 statements do not divide into 45s, so exams 5 to 8 each carry one priority repeat from the PDF’s list of corrected answers. Your progress is saved in this browser.</p></div>';
}

/* ---------- exam ---------- */
const CH=[{v:1,l:'T',t:'True'},{v:0,l:'F',t:'False'}];
function examView(n){
  activeN=n;
  const list=EXAMS[n],s=ex(n);
  if(!(s.cur>=0&&s.cur<list.length))s.cur=0;
  const i=s.cur,item=list[i],q=QBY[item.id],a=s.ans[i],done=a!==undefined;
  const k=answered(n),sc=score(n),left=TOTAL-k;
  let seg='';
  for(let x=0;x<TOTAL;x++){const v=s.ans[x];seg+='<i class="'+(x===i?'cur':(v===undefined?'':(v===qAt(n,x).a?'ok':'no')))+'"></i>'}
  const badges=[];
  if(q.f.indexOf('s')>=0)badges.push('<span class="badge star">★ High-yield</span>');
  if(q.f.indexOf('w')>=0)badges.push('<span class="badge star">Corrected key</span>');
  if(item.rep)badges.push('<span class="badge rep">Priority repeat</span>');
  const choices=CH.map(c=>{
    let cls='choice',mk='';
    if(done){
      if(c.v===q.a){cls+=' right';mk=ICON.ok+'<span class="sr">Correct answer</span>'}
      else if(c.v===a){cls+=' wrong';mk=ICON.no+'<span class="sr">Your answer</span>'}
      else cls+=' dim';
    }
    return '<button type="button" class="'+cls+'" data-act="pick" data-v="'+c.v+'"'+(done?' aria-disabled="true"':'')+'><span class="bub">'+c.l+'</span><span class="lbl">'+c.t+'</span><span class="mk">'+mk+'</span></button>';
  }).join('');
  let fb='';
  if(done){
    const right=a===q.a;
    fb='<div class="fb '+(right?'good':'bad')+'" role="status"><div class="fb-h">'+(right?ICON.ok+' Correct':ICON.no+' Not quite')+'<span class="fb-ans">This statement is '+(q.a?'TRUE':'FALSE')+'</span></div>'+
      '<p class="fb-why">'+esc(q.e)+'</p>'+
      '<div class="fb-meta">'+(q.f.indexOf('t')>=0?'<span class="badge trap">Exam trap</span>':'')+(q.r?'<span>Source: '+esc(q.r)+'</span>':'')+(q.s?'<span>Seen in: '+esc(q.s)+'</span>':'')+'<span>Bank #'+q.id+'</span></div></div>';
  }
  const last=i===TOTAL-1;
  const nextBtn=last
    ?'<button class="btn primary" type="button" data-act="finish"'+(done?'':' disabled')+'>Finish exam</button>'
    :'<button class="btn primary" type="button" data-act="next"'+(done?'':' disabled')+'>Next'+ICON.next+'</button>';
  let cells='';
  for(let x=0;x<TOTAL;x++){const v=s.ans[x];let c='cell';if(v!==undefined)c+=(v===qAt(n,x).a?' ok':' no');if(x===i)c+=' cur';
    cells+='<button type="button" class="'+c+'" data-act="jump" data-i="'+x+'" aria-label="Question '+(x+1)+(v===undefined?', unanswered':v===qAt(n,x).a?', correct':', incorrect')+'"'+(x===i?' aria-current="true"':'')+'>'+(x+1)+'</button>'}
  const finishBox=confirmFinish
    ?'<div class="map-foot"><p>'+left+' unanswered will count as wrong.</p><span><button class="btn danger" type="button" data-act="finish-go">Finish anyway</button> <button class="btn ghost" type="button" data-act="finish-cancel">Keep going</button></span></div>'
    :'<div class="map-foot"><p>'+(left?left+' left to answer.':'All answered.')+'</p><button class="btn" type="button" data-act="finish">'+(left?'Finish early':'See results')+'</button></div>';
  $('#app').innerHTML=
    '<div class="ex-head"><button class="btn ghost" type="button" data-act="home">'+ICON.back+' Exams</button><h2>Exam '+n+'</h2><button class="chip" type="button" data-act="hints" aria-pressed="'+(store.hints?'true':'false')+'">Watch words</button></div>'+
    '<div class="seg" aria-hidden="true">'+seg+'</div>'+
    '<div class="statline"><span><b>'+k+'</b> / '+TOTAL+' answered · <b>'+sc+'</b> correct</span><button class="chip mapbtn" type="button" data-act="map" aria-expanded="'+(mapOpen?'true':'false')+'">'+(mapOpen?'Hide map':'Question map')+'</button></div>'+
    (mapOpen?'<div class="map"><div class="map-grid">'+cells+'</div>'+finishBox+'</div>':'')+
    '<section class="q" aria-labelledby="st"><div class="q-top"><span class="topic">'+esc(GROUPS[q.g])+'</span><span class="qn">Question '+(i+1)+' of '+TOTAL+'</span></div>'+
    (badges.length?'<div class="badges">'+badges.join('')+'</div>':'')+
    '<p class="stmt" id="st">'+stmt(q.t)+'</p>'+
    '<div class="choices" role="group" aria-label="True or false">'+choices+'</div>'+
    '<div aria-live="polite">'+fb+'</div>'+
    '<p class="hint">Keys: T or F to answer · ← → to move'+(store.hints?' · Highlighted words often make a statement false':'')+'</p></section>'+
    '<div class="actions"><button class="btn" type="button" data-act="prev"'+(i===0?' disabled':'')+'>'+ICON.back+' Previous</button>'+nextBtn+'</div>';
}

/* ---------- results ---------- */
function resultsView(n){
  activeN=n;
  const list=EXAMS[n],s=ex(n),sc=score(n),pct=Math.round(sc/TOTAL*100);
  const verdict=pct>=90?'Excellent. You are exam ready.':pct>=75?'Strong result. Review the misses below.':pct>=60?'Solid base. The explanations will close the gap.':'Keep going. Read every explanation, then retake.';
  const R=54,C=2*Math.PI*R,off=C*(1-sc/TOTAL),col=pct>=75?'var(--good)':pct>=50?'var(--amber)':'var(--bad)';
  const ring='<div class="ring"><svg width="150" height="150" viewBox="0 0 150 150" role="img" aria-label="'+sc+' out of '+TOTAL+'"><circle cx="75" cy="75" r="'+R+'" fill="none" stroke="var(--surface2)" stroke-width="14"/><circle cx="75" cy="75" r="'+R+'" fill="none" stroke="'+col+'" stroke-width="14" stroke-linecap="round" stroke-dasharray="'+C.toFixed(1)+'" stroke-dashoffset="'+off.toFixed(1)+'" transform="rotate(-90 75 75)"/></svg><div class="ring-in"><div class="big">'+sc+'<small>/'+TOTAL+'</small></div></div></div>';
  const by={};GORDER.forEach(g=>by[g]={c:0,t:0});
  list.forEach((it,i)=>{const q=QBY[it.id];by[q.g].t++;if(s.ans[i]===q.a)by[q.g].c++});
  const topics=GORDER.filter(g=>by[g].t).map(g=>{const b=by[g],p=b.c/b.t;return '<div class="t-row"><div class="t-h"><span>'+esc(GROUPS[g])+'</span><b>'+b.c+' / '+b.t+'</b></div><div class="meter '+(p>=.75?'good':p>=.5?'mid':'low')+'"><i style="width:'+(p*100)+'%"></i></div></div>'}).join('');
  let rv='';
  list.forEach((it,i)=>{
    const q=QBY[it.id],a=s.ans[i],un=a===undefined,ok=a===q.a;
    if(filter==='wrong'&&ok)return;
    const st=ok?'<span class="st ok">'+ICON.ok+'<span class="sr">Correct</span></span>':un?'<span class="st skip">'+ICON.dash+'<span class="sr">Unanswered</span></span>':'<span class="st no">'+ICON.no+'<span class="sr">Wrong</span></span>';
    rv+='<details class="rv"><summary><span class="n">Q'+(i+1)+'</span>'+st+'<span class="qq">'+esc(q.t)+'</span></summary><div class="rv-body">'+
      '<p>Your answer: '+(un?'<span class="t-no">not answered</span>':'<span class="'+(ok?'t-ok':'t-no')+'">'+(a?'True':'False')+'</span>')+' · Correct answer: <span class="t-ok">'+(q.a?'True':'False')+'</span></p>'+
      '<p>'+esc(q.e)+'</p>'+(q.r?'<p class="meta">Source: '+esc(q.r)+'</p>':'')+
      '<p><button class="btn ghost" type="button" data-act="goto" data-n="'+n+'" data-i="'+i+'">Open in exam</button></p></div></details>';
  });
  const wrong=TOTAL-sc;
  if(!rv)rv='<p class="sub">'+(filter==='wrong'?'No mistakes in this attempt. Nothing to review.':'')+'</p>';
  $('#app').innerHTML=
    '<div class="ex-head"><button class="btn ghost" type="button" data-act="home">'+ICON.back+' Exams</button><h2>Exam '+n+' results</h2><span></span></div>'+
    '<div class="res"><section class="score">'+ring+'<div><p class="verdict">'+pct+'% · '+verdict+'</p><p class="sub">'+(wrong?wrong+' to review below.':'A perfect score.')+'</p></div></section>'+
    '<section class="topics" aria-label="Score by topic"><div class="eyebrow">Score by topic</div>'+topics+'</section>'+
    '<div class="res-act"><button class="btn primary" type="button" data-act="retake" data-n="'+n+'">Retake this exam</button><button class="btn" type="button" data-act="goto" data-n="'+n+'" data-i="0">Go through questions</button><button class="btn ghost" type="button" data-act="home">Choose another exam</button></div>'+
    '<h2 class="sec-h" style="margin:8px 0 0">Review</h2><div class="filters"><button class="chip" type="button" data-act="filter" data-f="wrong" aria-pressed="'+(filter==='wrong')+'">Mistakes ('+wrong+')</button><button class="chip" type="button" data-act="filter" data-f="all" aria-pressed="'+(filter==='all')+'">All questions ('+TOTAL+')</button></div>'+
    '<div class="review">'+rv+'</div></div>';
}

/* ---------- routing ---------- */
function render(){
  const h=location.hash.slice(1);let m;
  if((m=/^exam-([1-8])$/.exec(h)))examView(+m[1]);
  else if((m=/^results-([1-8])$/.exec(h)))resultsView(+m[1]);
  else home();
}
function go(h){if(location.hash.slice(1)===h){render()}else{location.hash=h}}
window.addEventListener('hashchange',()=>{confirmFinish=false;pendingRestart=0;mapOpen=false;render();window.scrollTo(0,0)});
function finish(n){const s=ex(n);s.done=true;const sc=score(n);if(s.best==null||sc>s.best)s.best=sc;save();confirmFinish=false;mapOpen=false;go('results-'+n)}
function reset(n){const s=ex(n);s.ans={};s.done=false;s.cur=0;save()}
function focusNext(){const b=document.querySelector('[data-act="next"]:not([disabled]),.actions [data-act="finish"]:not([disabled])');if(b&&b.focus)b.focus({preventScroll:true})}
function scrollTop(){const c=document.querySelector('.ex-head');if(c&&c.scrollIntoView)c.scrollIntoView({block:'start',behavior:'auto'})}
function pick(v){
  if(!activeN||!/^#exam-/.test(location.hash))return;
  const s=ex(activeN),i=s.cur,q=qAt(activeN,i);
  if(s.ans[i]!==undefined)return;
  s.ans[i]=v;s.done=false;save();render();focusNext();
  const f=document.querySelector('.fb');if(f&&f.scrollIntoView)f.scrollIntoView({block:'nearest',behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});
}
function step(d){
  const s=ex(activeN),to=s.cur+d;
  if(to<0||to>=TOTAL)return;
  if(d>0&&s.ans[s.cur]===undefined)return;
  s.cur=to;save();render();scrollTop();
}

/* ---------- events ---------- */
$('#app').addEventListener('click',ev=>{
  const t=ev.target.closest('[data-act]');if(!t)return;
  const act=t.dataset.act,n=+t.dataset.n||activeN;
  if(act==='open')go('exam-'+n);
  else if(act==='results')go('results-'+n);
  else if(act==='restart'){pendingRestart=n;render()}
  else if(act==='restart-go'){reset(n);pendingRestart=0;go('exam-'+n)}
  else if(act==='retake'){reset(n);go('exam-'+n)}
  else if(act==='home')go('');
  else if(act==='pick')pick(+t.dataset.v);
  else if(act==='next')step(1);
  else if(act==='prev')step(-1);
  else if(act==='jump'){const s=ex(n);s.cur=+t.dataset.i;mapOpen=false;save();render();scrollTop()}
  else if(act==='goto'){const s=ex(n);s.cur=+t.dataset.i;save();go('exam-'+n)}
  else if(act==='map'){mapOpen=!mapOpen;render()}
  else if(act==='hints'){store.hints=!store.hints;save();render()}
  else if(act==='finish'){if(TOTAL-answered(n)>0){confirmFinish=true;mapOpen=true;render()}else finish(n)}
  else if(act==='finish-go')finish(n);
  else if(act==='finish-cancel'){confirmFinish=false;render()}
  else if(act==='filter'){filter=t.dataset.f;render()}
});
document.addEventListener('keydown',ev=>{
  if(ev.ctrlKey||ev.metaKey||ev.altKey)return;
  if(!/^#exam-/.test(location.hash)||!activeN)return;
  const k=ev.key.toLowerCase();
  if(k==='arrowright'||k==='n'){step(1);return}
  if(k==='arrowleft'||k==='p'){step(-1);return}
  if(k==='t'||k==='1')pick(1);
  else if(k==='f'||k==='2')pick(0);
});
render();
</script>

</body></html>
