<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>HUM x71 Exam Bank</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;600;700;800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: one narrow column, like a single answer sheet. Home is a list of eight exam rows. An exam is one statement per screen with two big True / False bubbles. */
:root{
  --bg:#f6f5fb; --surface:#ffffff; --surface2:#ebe9f6; --ink:#17152b; --muted:#5b5877; --line:#d8d5ea;
  --accent:#5136d6; --accent-ink:#ffffff; --accent-soft:#e7e2fc;
  --good:#116c45; --good-soft:#d6f0e3; --bad:#b3261e; --bad-soft:#fbe0dd;
  --amber:#7f5300; --amber-soft:#fbecc6;
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#100f1b; --surface:#1a1928; --surface2:#262439; --ink:#ece9ff; --muted:#a3a0bd; --line:#322f4b;
    --accent:#ab9eff; --accent-ink:#15112f; --accent-soft:#2d2755;
    --good:#62d69e; --good-soft:#123a2b; --bad:#ff8f86; --bad-soft:#412122;
    --amber:#f3c660; --amber-soft:#3b3012;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#100f1b; --surface:#1a1928; --surface2:#262439; --ink:#ece9ff; --muted:#a3a0bd; --line:#322f4b;
  --accent:#ab9eff; --accent-ink:#15112f; --accent-soft:#2d2755;
  --good:#62d69e; --good-soft:#123a2b; --bad:#ff8f86; --bad-soft:#412122;
  --amber:#f3c660; --amber-soft:#3b3012;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
body{
  background:var(--bg); color:var(--ink); font-family:var(--f-body); font-size:16px; line-height:1.55;
  padding-block:0 40px;
  padding-left:max(16px, env(safe-area-inset-left,0px));
  padding-right:max(16px, env(safe-area-inset-right,0px));
}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}
.wrap{max-width:760px;margin:0 auto}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.mono{font-family:var(--f-mono)}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:16px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:800;font-size:1.1rem;letter-spacing:-.01em;color:var(--ink);text-decoration:none}
.brand svg{flex:none}
.icon-btn{display:inline-grid;place-items:center;width:44px;height:44px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface)}
.icon-btn:hover{border-color:var(--accent)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:10px 20px;border-radius:99px;border:1.5px solid var(--line);background:var(--surface);font-weight:600;font-size:.95rem;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.1)}
.btn.ghost{background:transparent}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn[disabled]{opacity:.4;cursor:not-allowed;filter:none}
.btn[disabled]:hover{border-color:var(--line)}

/* home */
.eyebrow{font-family:var(--f-mono);font-size:.76rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--f-display);font-weight:800;font-size:clamp(2.3rem,8vw,3.7rem);line-height:1.02;letter-spacing:-.035em;margin:10px 0 14px;text-wrap:balance}
h1 em{font-style:normal;color:var(--accent)}
.lede{max-width:52ch;color:var(--muted);font-size:1.06rem;margin:0}
.cover{margin:24px 0 8px;padding:16px 18px;border:1.5px solid var(--line);border-radius:16px;background:var(--surface);display:grid;gap:10px}
.cover-h{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:.92rem}
.cover-h b{font-family:var(--f-mono);font-weight:500}
.meter{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);border-radius:99px}
.meter.good i{background:var(--good)}
.meter.mid i{background:var(--amber)}
.meter.low i{background:var(--bad)}
.sec-h{font-family:var(--f-display);font-weight:700;font-size:1.3rem;margin:30px 0 12px;letter-spacing:-.01em}
.rows{display:grid;gap:12px}
.row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:6px 18px;align-items:center;background:var(--surface);border:1.5px solid var(--line);border-radius:18px;padding:18px 20px}
.num{font-family:var(--f-display);font-weight:800;font-size:2.6rem;line-height:1;color:var(--accent);letter-spacing:-.04em;min-width:1.7em}
.row-main{min-width:0;display:grid;gap:6px}
.row-title{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.row-title h3{font-family:var(--f-display);font-weight:700;font-size:1.2rem;margin:0}
.pill{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.05em;text-transform:uppercase;padding:2px 9px;border-radius:99px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill.prog{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.pill.done{background:var(--good-soft);color:var(--good);border-color:transparent}
.meta{margin:0;font-family:var(--f-mono);font-size:.78rem;color:var(--muted)}
.note{margin:0;font-size:.88rem;color:var(--muted)}
.omr{display:flex;flex-wrap:wrap;gap:3px;margin:2px 0}
.omr i{width:8px;height:8px;border-radius:50%;border:1.5px solid var(--line);display:block}
.omr i.ok{background:var(--good);border-color:var(--good)}
.omr i.no{background:var(--bad);border-color:var(--bad)}
.row-act{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
@media (max-width:620px){
  .row{grid-template-columns:auto minmax(0,1fr)}
  .row-act{grid-column:1 / -1;justify-content:stretch}
  .row-act .btn{flex:1 1 auto}
}
.foot{margin:34px 0 0;display:grid;gap:10px;color:var(--muted);font-size:.88rem;max-width:66ch}
.foot p{margin:0}

/* exam header */
.ex-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:2px 0 14px}
.ex-head h2{font-family:var(--f-display);font-weight:800;font-size:1.4rem;margin:0;letter-spacing:-.02em}
.chip{min-height:40px;padding:6px 14px;border-radius:99px;border:1.5px solid var(--line);background:var(--surface);font-size:.86rem;font-weight:600}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.seg{display:grid;grid-template-columns:repeat(45,minmax(0,1fr));gap:2px;margin-bottom:10px}
.seg i{height:6px;border-radius:3px;background:var(--surface2);display:block}
.seg i.ok{background:var(--good)}
.seg i.no{background:var(--bad)}
.seg i.cur{background:var(--accent)}
.statline{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-family:var(--f-mono);font-size:.78rem;color:var(--muted);margin-bottom:14px}
.statline b{color:var(--ink);font-weight:500}
.mapbtn{min-height:36px;padding:4px 12px;font-size:.8rem}
.map{background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px;display:grid;gap:12px}
.map-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px}
.cell{height:40px;border-radius:50%;border:1.5px solid var(--line);background:var(--bg);font-family:var(--f-mono);font-size:.8rem;display:grid;place-items:center;padding:0}
.cell:hover{border-color:var(--accent)}
.cell.ok{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.cell.no{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.cell.cur{outline:3px solid var(--accent);outline-offset:1px}
.map-foot{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.map-foot p{margin:0;font-size:.85rem;color:var(--muted)}

/* question card */
.q{background:var(--surface);border:1.5px solid var(--line);border-radius:22px;padding:clamp(18px,4vw,30px);min-width:0}
.q-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.topic{font-family:var(--f-mono);font-size:.74rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.qn{font-family:var(--f-mono);font-size:.78rem;color:var(--muted)}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.badge{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.04em;padding:2px 9px;border-radius:99px;background:var(--surface2);color:var(--muted)}
.badge.star{background:var(--amber-soft);color:var(--amber)}
.badge.rep{background:var(--accent-soft);color:var(--accent)}
.badge.trap{background:var(--amber-soft);color:var(--amber)}
.stmt{font-family:var(--f-display);font-weight:600;font-size:clamp(1.25rem,4.2vw,1.65rem);line-height:1.36;letter-spacing:-.012em;margin:16px 0 22px;text-wrap:pretty}
mark.abs{background:var(--amber-soft);color:var(--ink);border-radius:5px;padding:0 3px;box-shadow:inset 0 -2px 0 var(--amber)}
.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.choices>*{min-width:0}
.choice .mk:empty{display:none}
.choice{display:flex;align-items:center;gap:12px;min-height:76px;padding:12px 16px;border-radius:18px;border:2px solid var(--line);background:var(--bg);text-align:left;font-family:var(--f-display);font-weight:700;font-size:1.25rem}
.choice .bub{flex:none;display:grid;place-items:center;width:40px;height:40px;border-radius:50%;border:2px solid currentColor;font-family:var(--f-mono);font-weight:500;font-size:.95rem;color:var(--muted)}
.choice .lbl{flex:1;min-width:0}
.choice .mk{display:grid;place-items:center;width:24px}
.choice:hover{border-color:var(--accent);background:var(--accent-soft)}
.choice:hover .bub{color:var(--accent)}
.choice.right{background:var(--good-soft);border-color:var(--good)}
.choice.right .bub{background:var(--good);border-color:var(--good);color:var(--surface)}
.choice.right .mk{color:var(--good)}
.choice.wrong{background:var(--bad-soft);border-color:var(--bad)}
.choice.wrong .bub{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.choice.wrong .mk{color:var(--bad)}
.choice.dim{opacity:.55}
.choice.right:hover,.choice.wrong:hover,.choice.dim:hover{cursor:default}
.choice.dim:hover{border-color:var(--line);background:var(--bg)}
.choice.dim:hover .bub{color:var(--muted)}
@media (max-width:480px){.choices{gap:10px}.choice{gap:8px;padding:10px 12px;font-size:1.1rem;min-height:68px}.choice .bub{width:34px;height:34px;font-size:.85rem}.choice .mk{width:20px}}
.fb{margin-top:20px;border-radius:16px;padding:16px 18px;border:2px solid var(--line)}
.fb.good{background:var(--good-soft);border-color:var(--good)}
.fb.bad{background:var(--bad-soft);border-color:var(--bad)}
.fb-h{display:flex;align-items:center;flex-wrap:wrap;gap:6px 10px;font-family:var(--f-display);font-weight:800;font-size:1.2rem}
.fb.good .fb-h{color:var(--good)}
.fb.bad .fb-h{color:var(--bad)}
.fb-ans{font-family:var(--f-mono);font-weight:500;font-size:.78rem;letter-spacing:.03em;color:var(--ink);opacity:.85}
.fb-why{margin:10px 0 0;max-width:62ch}
.fb-meta{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin-top:12px;font-family:var(--f-mono);font-size:.74rem;color:var(--muted)}
.hint{margin:16px 0 0;font-family:var(--f-mono);font-size:.74rem;color:var(--muted)}
.actions{position:sticky;bottom:0;display:flex;gap:10px;justify-content:space-between;margin-top:16px;padding:12px 0 calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--bg) 72%,transparent)}
.actions .btn.primary{min-width:150px}
@media (prefers-reduced-motion:no-preference){.meter i{transition:width .3s ease}.choice{transition:background .15s,border-color .15s}}

/* results */
.res{display:grid;gap:18px}
.score{display:grid;gap:20px;grid-template-columns:minmax(0,1fr);justify-items:center;text-align:center;background:var(--surface);border:1.5px solid var(--line);border-radius:22px;padding:clamp(20px,4vw,32px)}
@media (min-width:640px){.score{grid-template-columns:auto minmax(0,1fr);justify-items:start;text-align:left;align-items:center}}
.ring{position:relative;width:150px;height:150px}
.ring svg{display:block}
.ring-in{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.big{font-family:var(--f-display);font-weight:800;font-size:2.7rem;line-height:1;letter-spacing:-.04em}
.big small{font-size:1rem;color:var(--muted);font-weight:700}
.verdict{font-family:var(--f-display);font-weight:700;font-size:1.35rem;margin:0 0 4px;letter-spacing:-.01em}
.sub{margin:0;color:var(--muted)}
.topics{display:grid;gap:14px;background:var(--surface);border:1.5px solid var(--line);border-radius:18px;padding:18px}
.t-row .t-h{display:flex;justify-content:space-between;gap:10px;font-size:.92rem;margin-bottom:6px}
.t-row .t-h b{font-family:var(--f-mono);font-weight:500;white-space:nowrap}
.res-act{display:flex;flex-wrap:wrap;gap:10px}
.filters{display:flex;gap:8px;flex-wrap:wrap}
.review{display:grid;gap:10px}
details.rv{background:var(--surface);border:1.5px solid var(--line);border-radius:14px}
details.rv summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:auto 22px minmax(0,1fr);gap:12px;align-items:center;padding:12px 14px}
details.rv summary::-webkit-details-marker{display:none}
details.rv .n{font-family:var(--f-mono);font-size:.82rem;color:var(--muted);min-width:2.2em}
details.rv .st.ok{color:var(--good)}details.rv .st.no{color:var(--bad)}details.rv .st.skip{color:var(--muted)}
details.rv .qq{overflow-wrap:anywhere}
.rv-body{padding:2px 16px 16px;display:grid;gap:8px;font-size:.95rem}
.rv-body p{margin:0}
.t-ok{color:var(--good);font-weight:700}.t-no{color:var(--bad);font-weight:700}
</style>

<div class="wrap">
  <header class="top">
    <a class="brand" href="#" id="brand" aria-label="HUM x71 Exam Bank home">
      <svg width="34" height="20" viewBox="0 0 34 20" fill="none" aria-hidden="true"><circle cx="5" cy="10" r="4" stroke="currentColor" stroke-width="2"/><circle cx="13" cy="10" r="4" fill="var(--accent)" stroke="var(--accent)" stroke-width="2"/><circle cx="21" cy="10" r="4" stroke="currentColor" stroke-width="2"/><circle cx="29" cy="10" r="4" stroke="currentColor" stroke-width="2"/></svg>
      <span>HUM x71</span>
    </a>
    <button class="icon-btn" id="theme" type="button"></button>
  </header>
  <main id="app"></main>
</div>

<script>
const Q=[[1,"BM-1","bm","Business is defined as an enterprise providing products or services desired by customers, driven by organized, profit- seeking activities.",1,"Slide 3 gives two definitions of business: an organized enterprise that provides goods or services customers want, and profit-seeking activity directed at serving customers.","Business Lec 1, Slide 3","",""],[2,"BM-2","bm","Goods (products) are tangible physical items that can be stored, whereas services (banking, airlines, hotels, hospitals) are intangible activities that cannot be stored.",1,"Goods are tangible and can be stored. Services such as banking, flights, hotels and hospitals are intangible activities that cannot be stored.","Mid 1 2025 Q6, Mid 2 2025 Q39","",""],[3,"BM-3","bm","Non-profit organizations (charities, public universities, government hospitals) do not need business functions like Finance, Operations, Marketing, or HR.",0,"Non-profits such as charities, public universities and government hospitals still need Finance, Operations, Marketing and HR to keep running and serve society well.","Business Lec 1","","t"],[4,"BM-4","bm","Businesses exist beyond basic profit for three core reasons: Value Creation, Wealth Generation, and Social Utility.",1,"The three reasons a business exists beyond profit are Value Creation (solving customer problems), Wealth Generation (jobs and returns) and Social Utility (driving progress).","Business Lec 1, Slide 4","",""],[5,"BM-5","bm","During the Industrial Revolution (18th–19th Century), business transitioned from craft handcrafting to steam- powered factory mechanization.",1,"The first era of modern business was the Industrial Revolution, when production moved from craft workshops to steam-powered factories.","Business Lec 1, Slide 5","",""],[6,"BM-6","bm","In 1913, Henry Ford revolutionized the Mass Production Era by introducing the moving assembly line for the Model T.",1,"In 1913 Henry Ford introduced the moving assembly line for the Model T, which defined the Mass Production Era.","Business Lec 1, Slides 5 and 9","",""],[7,"BM-7","bm","Henry Ford's assembly line revolution relied on three key innovations: Division of Labor, Economies of Scale, and Standardization.",1,"Ford’s system rested on three ideas: Division of Labor, Economies of Scale and Standardization of interchangeable parts.","Business Lec 1, Slide 9","",""],[8,"BM-8","bm","In the Late 20th Century (Global Function Era), corporations divided into specialized functions such as Marketing, HR, Finance, and R&D.",1,"The Late 20th Century is the Global Function Era, when firms split into specialist departments such as Marketing, HR, Finance and R&D.","Business Lec 1, Slide 5","",""],[9,"BM-9","bm","The 21st Century Digital Ecosystems era is characterized by agile software-driven models, platform business models, and AI integration.",1,"The 21st Century is the Digital Ecosystems era: agile software-driven models, platform businesses and AI integration.","Business Lec 1, Slide 5","",""],[10,"BM-10","bm","Organizations that neglect market dynamics and fail to adapt to their environment tend, like dinosaurs, to disappear.",1,"The core warning of the lecture is that companies that fail to adapt to their environment disappear, like the dinosaurs.","Business Lec 1, Slides 6-7","",""],[11,"BM-11","bm","Nokia collapsed in the late 2000s (despite having over 40% market share) because its hardware quality was poor and fragile.",0,"Nokia’s hardware was durable. It collapsed about three years after iOS and Android arrived because it was slow to adapt to the software ecosystem and was held back by bureaucracy.","Business Lec 1, Slide 8","","t"],[12,"BM-12","bm","Nokia's fear of cannibalizing its existing feature-phone revenue and slow organizational responsiveness contributed to its strategic failure.",1,"Nokia feared cannibalizing its feature-phone sales and its internal bureaucracy slowed its response. Both contributed to its strategic failure.","Business Lec 1, Slide 8","",""],[13,"BM-13","bm","Operations and Production focuses on converting raw inputs into finished goods/services efficiently while minimizing waste.",1,"Operations and Production turns raw inputs into finished goods and services efficiently, while controlling quality and cutting waste.","Business Lec 1, Slides 14-15","",""],[14,"BM-14","bm","Marketing and Sales focuses on budgeting, bookkeeping, tax planning, and keeping the business financially solvent.",0,"Swapped pillars. Budgeting, bookkeeping, tax planning and solvency belong to Finance and Accounting, not to Marketing and Sales.","Business Lec 1, Slides 15-16","","t"],[15,"BM-15","bm","Human Resources (HR) oversees recruiting, onboarding, employee benefits, labor compliance, and maintaining a safe, positive workplace culture.",1,"HR handles recruiting, onboarding, pay and benefits, labor compliance and a safe, positive workplace culture.","Business Lec 1, Slide 16","",""],[16,"BM-16","bm","Keeping a business open is considered an 'Art' because it requires Constant Adaptation, Balancing the Pillars (Finance, Marketing, Operations), and Creative Problem Solving.",1,"Keeping a business open is called an Art because it needs constant adaptation, balance across all four pillars at once, and creative problem solving.","Business Lec 1, Slide 17","",""],[17,"BM-17","bm","In global corporate surveys, Internal Environment factors impact company performance much more than External Environment factors.",0,"Number trap. About 71% of executives (44% + 27%) say external factors affect performance more than internal ones, so the statement is reversed.","Business Lec 1, Slide 18","","t"],[18,"BM-18","bm","According to corporate leader surveys, Technological factors (90% impact) and Competition (85% impact) are the top two external drivers impacting performance, followed by Economic (80%), Political/Legal (70%), and Social/Cultural (65%).",1,"The ranking of external drivers is Technological 90%, Competition 85%, Economic 80%, Political/Legal 70% and Social/Cultural 65%.","Business Lec 1, Slide 19","",""],[19,"BM-19","bm","Leadership style, corporate culture, employee capabilities, financial liquidity, and physical infrastructure are part of the uncontrollable External Environment.",0,"Leadership style, culture, staff capabilities, liquidity and infrastructure are internal and controllable. They are not part of the uncontrollable external environment.","Business Lec 1, Slide 18","",""],[20,"BM-20","bm","Macro forces (PESTLE: inflation, trade laws, tech trends, demographics) and Micro forces (customers, suppliers, direct rivals) make up the uncontrollable External Environment.",1,"PESTLE macro forces and the micro forces (customers, suppliers, direct rivals) together make up the external environment, which managers cannot control.","Business Lec 1, Slide 18","",""],[21,"BM-21","bm","In the 4-step Marketing Orientation flow, the sequence is: (1) Understand → (2) Create → (3) Deliver → (4) Build Relationships.",1,"Marketing orientation runs in this order: Understand the customer, Create value, Deliver it, Build relationships.","Marketing Lec 2, Slide 4","",""],[22,"BM-22","bm","According to the American Marketing Association (AMA), marketing is the activity, institutions, and processes for creating, communicating, delivering, and exchanging offerings that have value for customers, clients, partners, and society.",1,"This is the American Marketing Association definition: creating, communicating, delivering and exchanging offerings that have value for customers, clients, partners and society.","Marketing Lec 2, Slide 3","",""],[23,"BM-23","bm","A 'Want' is a basic human requirement for survival, whereas a 'Need' is a want backed by purchasing power.",0,"Swapped. A Need is the basic requirement for survival. A Want is a need shaped by culture, and a Want backed by purchasing power is a Demand.","Marketing Lec 2 Slide 20, Lec 3 Slide 22","","t"],[24,"BM-24","bm","The Customer is the individual or entity who buys/purchases the product, whereas the Consumer is the end-user who actually uses/consumes it.",1,"The customer is the one who pays for the product. The consumer is the person who actually uses it.","Mid 1 2025 Q10","","t"],[25,"BM-25","bm","The Production Orientation (1900–1930s) focuses on making more products at lower cost and high availability, which is useful when demand exceeds supply.",1,"The Production concept focuses on making more units at lower cost with high availability. It works when demand exceeds supply.","Mid 1 2025 Q14","",""],[26,"BM-26","bm","The Selling Orientation (1930s–1950s) starts with existing factory products and assumes consumers will only buy if the firm aggressively promotes and pushes sales.",1,"The Selling concept starts from existing products and assumes people will only buy if the firm promotes and pushes hard.","Mid 1 2025 Q11","",""],[27,"BM-27","bm","The Societal Marketing Orientation focuses solely on maximizing short-term sales volume regardless of environmental impact.",0,"Societal Marketing balances customer wants, company profit and society’s well-being. It does not chase short-term sales regardless of impact.","Mid 1 2025 Q15","","t"],[28,"BM-28","bm","Selling is a broader concept than marketing; marketing is just one small component inside selling.",0,"Reversed. Marketing is the broader idea and starts earlier. Selling is only one component inside marketing.","Marketing Lec 2, Slide 7","",""],[29,"BM-29","bm","Selling asks 'How do we sell it?' with a shorter-term focus on units/revenue, whereas Marketing asks 'What should we offer?' with a long-term focus on customer value, satisfaction (VOC), and loyalty.",1,"Selling starts from the product, asks how to sell it, and looks at short-term revenue. Marketing starts from the customer, asks what to offer, and looks at long-term value and loyalty.","Marketing Lec 2, Slide 7","",""],[30,"BM-30","bm","The traditional 4Ps marketing mix (popularized by Jerome McCarthy) consists of Product, Price, Place, and Promotion.",1,"The classic 4Ps, popularized by Jerome McCarthy, are Product, Price, Place and Promotion.","Marketing Lec 2, Slide 8","",""],[31,"BM-31","bm","For service businesses and customer experience, 3 additional Ps are added to form the 7Ps: People, Process, and Physical Evidence.",1,"Services add three Ps to make the 7Ps: People, Process and Physical Evidence.","Marketing Lec 2, Slide 9","",""],[32,"BM-32","bm","In the 7Ps framework, 'Price' represents what the customer receives, while 'Product' represents what the customer gives.",0,"Swapped. Product is what the customer receives. Price is what the customer gives.","Marketing Lec 2, Slide 10","","t"],[33,"BM-33","bm","Among the 4Ps, 'Price' is the easiest element for competitors to copy quickly, whereas Product design/quality, People, and Process create sustainable differentiation.",1,"Price is the easiest P for rivals to copy overnight. Product quality, People and Process build lasting differentiation.","Marketing Lec 2, Slide 10","","t"],[34,"BM-34","bm","Marketers need quantitative data from surveys ONLY when conducting market research.",0,"The word ONLY makes it false. Marketers combine quantitative data (surveys) with qualitative data (interviews, focus groups, observation).","Mid 1 2025 Q5; Marketing Lec 2, Slide 12","","t"],[35,"BM-35","bm","In Customer Research, the 6 essential questions are WHO, WHAT, WHY, HOW, HOW MUCH, and AFTER.",1,"The six essential customer research questions are WHO, WHAT, WHY, HOW, HOW MUCH and AFTER.","Marketing Lec 2, Slide 12","",""],[36,"BM-36","bm","When a bakery sells bread in bulk to a restaurant, or a textile factory sells fabric to a clothing factory, the market type is B2B (Business-to-Business / Industrial market).",1,"Selling in bulk to another company that uses the goods in its own production is Business-to-Business (B2B), also called an industrial market.","Marketing Lec 2, Slide 15","",""],[37,"BM-37","bm","When a student sells his used mobile phone or used textbooks to another student on Facebook Marketplace, the market type is C2B.",0,"A student selling a used phone to another student is Consumer-to-Consumer (C2C), not C2B. C2B is when an individual sells a service to a company.","Marketing Lec 2, Slide 16","","t"],[38,"BM-38","bm","When a freelance graphic designer creates a logo for a company and gets paid (or an influencer makes a promotional video for a company), the market type is C2B (Consumer-to- Business).",1,"A freelancer or influencer who sells a logo or promotional video to a company is Consumer-to-Business (C2B).","Marketing Lec 2, Slide 17","",""],[39,"BM-39","bm","STP stands for Segmentation, Targeting, and Positioning; and the 4 bases of Market Segmentation are Geographic, Demographic, Psychographic, and Behavioural.",1,"STP stands for Segmentation, Targeting and Positioning. The four bases of segmentation are Geographic, Demographic, Psychographic and Behavioral.","Marketing Lec 2, Slide 19","",""],[40,"BM-40","bm","In SWOT Analysis, Strengths and Opportunities are Internal factors, whereas Weaknesses and Threats are External factors.",0,"Swapped. In SWOT, Strengths and Weaknesses are internal, while Opportunities and Threats are external.","Marketing Lec 3, Slides 20-21","","t"],[41,"BM-41","bm","In the BCG Matrix, Relative Market Share (RMS) is calculated as Our Market Share divided by Total Market Sales.",0,"Relative Market Share is our share divided by the largest competitor’s share, not by total market sales.","Marketing Lec 3, Slide 14","","t"],[42,"BM-42","bm","If a market sold 200,000 units last year and 240,000 units this year, the Market Growth Rate is [(240,000 - 200,000) / 200,000] x 100 = 20%.",1,"Growth rate = (240,000 − 200,000) ÷ 200,000 × 100 = 20%, which is above the 10% line for high growth.","Marketing Lec 3, Slide 15","",""],[43,"BM-43","bm","If Company A sells 30,000 units and its largest competitor sells 15,000 units, Company A's Relative Market Share (RMS) is 2.0 (unitless ratio).",1,"RMS = 30,000 ÷ 15,000 = 2.0. It is a unitless ratio, and above 1.0 means a strong position against the leader.","Marketing Lec 3, Slide 14","",""],[44,"BM-44","bm","Products with High Market Share (RMS > 1) and High Market Growth (> 10%) are classified as 'Stars' (aligned with the Growth stage of the PLC), and the strategic decision is to Invest and Grow.",1,"High relative share (above 1) plus high growth (above 10%) is a Star, in the Growth stage. The decision is to invest and grow.","Marketing Lec 3, Slides 16 and 24","",""],[45,"BM-45","bm","Products with Low Market Share (RMS < 1) and High Market Growth (> 10%) are classified as 'Question Marks / Problem Children' (aligned with the Introduction stage of the PLC), requiring selective investment or exit.",1,"Low relative share (below 1) plus high growth is a Question Mark, in the Introduction stage. It needs selective investment or an exit.","Marketing Lec 3, Slides 17 and 24","",""],[46,"BM-46","bm","Products with High Market Share (RMS > 1) and Low Market Growth (<= 10%) are 'Cash Cows' (aligned with the Maturity stage of the PLC); their steady profits are used to fund and develop other products across the company.",1,"High share plus low growth (10% or less) is a Cash Cow, in the Maturity stage. Its steady profits fund other products.","Marketing Lec 3, Slides 18 and 24","",""],[47,"BM-47","bm","Products with Low Market Share (RMS < 1) and Low Market Growth (<= 10%) are 'Dogs' (Decline stage of PLC) and must always be eliminated immediately with zero exceptions.",0,"Dogs are reduced or exited, but not always at once and without exceptions. Sometimes a Dog is kept because another key product cannot be sold without it.","Marketing Lec 3, Slides 19 and 24","","t"],[48,"2025-E1","e1","When teaching the great achievements of engineers in the 20th century, we must stress that 'with great authority comes great responsibility.'",1,"Modern technology gives engineers great power over society, so the lecture stresses that great authority carries great responsibility.","Mid 1 2025 Q1; Ethics Lec 1","Mid 1 2025 Q1","s"],[49,"2025-E2","e1","Professionals have 'clients' rather than 'customers' because a client lacks the technical expertise to evaluate the work and must trust the professional's judgment.",1,"Professionals have clients, not customers. A client lacks the technical expertise to judge the work and must trust the professional’s judgment.","Mid 1 2025 Q2; Ethics Lec 1","Mid 1 2025 Q2","s"],[50,"2025-E3","e1","Legal responsibility focuses on individuals (who will be prosecuted in court), whereas ethical responsibility is shared collectively across the engineering team and corporation.",1,"Legal responsibility is individual and decided after the fact in court. Ethical responsibility is shared across the engineering team and the corporation.","Mid 1 2025 Q4; Fall 2023 Q38; Spring 2019 Q23","Mid 1 2025 Q4 | Fall 2023 Q38 | Spring 2019 Q23 | Gamal Q5","s"],[51,"2025-E4","e1","The primary goal of teaching engineering ethics is to provide students with a memorized rulebook of 'do's and don'ts' and abstract philosophical theorems rather than changing attitudes through case studies.",0,"The goal of teaching ethics is to improve moral judgment and change attitudes, often through case studies. It is not a memorized rulebook of do’s and don’ts.","Mid 1 2025 Q5; Fall 2023 Q25; Ethics Lec 1, Slide 35","Mid 1 2025 Q5 | Fall 2023 Q25","st"],[52,"M45-18","e1","Modern complicated technology necessitates paying attention to the ethical behavior more than simple engineering practices.",1,"Corrected key: True. Complex technology and large projects affect millions of people, so they call for more ethical attention than simple practices.","Ethics Lec 1, Slide 11","","w"],[53,"P1-53","e1","In engineering education, there is no standard for the quality of graduate.",0,"Accreditation bodies such as ABET, and national bodies, set strict standards for the quality of engineering graduates.","Ethics Lec 1, Slide 12","","s"],[54,"P1-55","e1","Engineering ethics is taught in many engineering faculties in Egypt.",1,"Ethics is taught in many engineering faculties in Egypt, and Alexandria has an international student chapter. Egyptian engineers have achievements to be proud of.","Ethics Lec 1","","s"],[55,"P1-58","e1","Responsible behavior is more important for a physician rather than an engineer.",0,"Responsible behavior matters equally for engineers. A single engineering failure can kill thousands of people.","Ethics Lec 1, Slide 11","","st"],[56,"P1-59","e1","According to the Accreditation Board for Engineering and Technology (ABET), engineering ethics is not one of the requirements of accrediting engineering programs.",0,"ABET requires ethics teaching for accrediting engineering programs, so the “not one of the requirements” wording is false.","Ethics Lec 1, Slide 12","","st"],[57,"P1-66","e1","Case studies are one way of teaching engineering ethics.",1,"Case studies are one of the best ways to teach engineering ethics because they build moral judgment.","Ethics Lec 1, Slide 35","","s"],[58,"P1-71","e1","An engineering student who attends professional seminars most probably will value the importance of continuing education after graduation.",1,"A student who attends professional seminars is likely to value continuing education after graduation.","Ethics Lec 1","","s"],[59,"P1-78","e1","There is at least one student chapter of an international professional society in the Faculty of Engineering in Alexandria.",1,"The Faculty of Engineering in Alexandria hosts at least one student chapter of an international professional society.","Ethics Lec 1","","s"],[60,"P1-79","e1","If an engineering student cheats in his exams, most probably he will cheat while performing his engineering duties.",1,"Academic honesty predicts professional honesty. A student who cheats in exams is likely to cheat in engineering work.","Ethics Lec 1","","s"],[61,"P1-80","e1","We should be proud of the Egyptian engineers' achievements over history.",1,"Engineering ethics teaching in Egypt includes taking pride in the achievements of Egyptian engineers across history.","Ethics Lec 1","","s"],[62,"P1-4","e1","Engineering is about products only.",0,"Engineering is not about products only. It also serves people, society and the environment.","Ethics Lec 1, Slide 22","",""],[63,"P1-15","e1","The study of engineering ethics strengthens one's ability to reason clearly and carefully about moral questions.",1,"Studying engineering ethics strengthens the ability to reason clearly and carefully about moral questions.","Ethics Lec 1","",""],[64,"P1-17","e1","Being responsible doesn't mean being accountable.",0,"Responsibility and accountability are linked. Being responsible includes legal and ethical duties and being answerable for them.","Ethics Lec 1","",""],[65,"P1-18","e1","Moral responsibility overlaps with legal responsibility.",1,"Moral responsibility and legal responsibility overlap, because many duties are both ethical and legal.","Ethics Lec 1","",""],[66,"P1-19","e1","Legal responsibility includes legal obligations and accountability for meeting them.",1,"Legal responsibility includes legal obligations and accountability for meeting them.","Ethics Lec 1","",""],[67,"P1-20","e1","Professions are those forms of work involving advanced expertise, self-regulation, and concerted service to the public good.",1,"Professions involve advanced expertise, self-regulation and concerted service to the public good.","Ethics Lec 1","",""],[68,"P1-21","e1","Professions require only sophisticated skills ('knowing-how') in exercising judgment that is not entirely routine or susceptible to mechanization.",0,"The word ONLY makes it false. Professions need both practical skill (knowing-how) and theoretical knowledge (knowing-that).","Ethics Lec 1, Slide 12","","t"],[69,"P1-22","e1","Professions are those forms of work which usually formulated in a code of ethics.",1,"Professions are usually formulated in a code of ethics.","Ethics Lec 1","",""],[70,"P1-34","e1","The development of good moral judgment is a primary goal in studying ethics.",1,"Developing good moral judgment is a primary goal of studying ethics.","Ethics Lec 1","",""],[71,"P1-61","e1","Ethically, engineers should perform jobs outside their area of competence to serve the clients better.",0,"Codes of ethics forbid working outside your area of competence, even to serve a client better.","Ethics Lec 1, Slide 32; NSPE Code","",""],[72,"2014-14","e1","The Hippocratic Oath is an early version of an engineering code of ethics in the construction field.",0,"The Hippocratic Oath belongs to medicine. The ancient construction code is Hammurabi’s Code (1758 B.C.).","Ethics Lec 1, Slides 27-28","","t"],[73,"2014-27","e1","Some engineering ethics topics are general to all engineers while others are specific to each program.",1,"Some ethics topics apply to all engineers, while others are specific to each engineering program.","Ethics Lec 1","",""],[74,"2014-55","e1","According to an American engineering creed that was published in the last century [NSPE Creed, 1954], members of the profession asked for divine guidance to fulfill their pledges.",1,"The NSPE Creed of 1954 asks for divine guidance in fulfilling the profession’s pledges.","Ethics Lec 1, Slide 22","",""],[75,"2014-59","e1","The key concepts of engineering professional behavior are competence, responsibility, and safety.",1,"The three key concepts of engineering professional behavior are competence, responsibility and safety.","Mid 1 2025 Q3; Fall 2023 Q32; Ethics Lec 1, Slide 32","",""],[76,"2014-60","e1","Engineering ethics is an 'interdisciplinary discipline' involving philosophy, social science, law, and business theory, in addition to engineering theory.",1,"Engineering ethics is interdisciplinary. It combines philosophy, social science, law and business theory with engineering theory.","Ethics Lec 1, Slide 26","",""],[77,"2013-33","e1","Engineering ethics is an interdisciplinary subject.",1,"Engineering ethics is an interdisciplinary subject.","Ethics Lec 1, Slide 26","",""],[78,"2013-39","e1","An engineering student who is a member of a professional organization most probably will value the importance of professional ethics.",1,"A student who belongs to a professional organization is likely to value professional ethics.","Ethics Lec 1","",""],[79,"2013-77","e1","When we understand the demands of engineering ethics in our fields, we can modify the engineering education as well as the engineering research.",1,"Understanding the demands of engineering ethics lets us improve both engineering education and engineering research.","Ethics Lec 1","",""],[80,"2013-78","e1","There is at least one student chapter of an international professional society in the Faculty of Engineering in Alexandria.",1,"The Faculty of Engineering in Alexandria hosts at least one student chapter of an international professional society.","Ethics Lec 1","",""],[81,"2013-79","e1","If an engineering student cheats in his exams, most probably he will cheat while performing his engineering duties.",1,"A student who cheats in exams will most probably cheat while doing engineering duties.","Ethics Lec 1","",""],[82,"2013-80","e1","We should be proud of the Egyptian engineers' achievements in modern history.",1,"Engineering ethics teaching includes taking pride in the achievements of Egyptian engineers in modern history.","Ethics Lec 1","",""],[83,"2025-E5","e2","It is the client's responsibility to monitor and supervise the technical performance of subcontractors on an engineering project.",0,"The main contractor, not the client, is responsible for monitoring and supervising subcontractors.","Fall 2023 Q37; Gamal Q4","Fall 2023 Q37 | Gamal Q4","s"],[84,"2025-E6","e2","Groupthinking is identical to shared corporate values and promotes harmony, critical thinking, and innovation inside engineering teams.",0,"Shared values promote harmony and innovation. Groupthink is blind conformity that kills critical thinking and innovation, so the two are not identical.","Mid 1 2025 Q20; Fall 2023 Q34","Mid 1 2025 Q20 | Fall 2023 Q34 | Spring 2019 Q13 | Gamal Q3","st"],[85,"2025-E7","e2","To overcome silo mentality in an engineering company, management should rotate/move engineers between departments for a period of time and hold cross- departmental gatherings.",1,"Rotating engineers between departments and holding cross-department gatherings spreads knowledge and breaks the silo mentality.","Ethics Lec 2, Slide 9","Fall 2023 Q33 | Spring 2019 Q17 | Midterm w/ Sol Q13","s"],[86,"2025-E8","e2","When the European Union (EU) considered banning facial recognition in public spaces for 3–5 years to assess potential harms, this illustrated Theme 7: Cautious Optimism (NOT 'promoting responsible conduct over punishing wrongdoings').",1,"Delaying a technology for 3 to 5 years to assess its harms is Theme 7, Cautious Optimism (technology is a two-edged sword). It is not Theme 4.","Fall 2023 Q18; Ethics Lec 2, Slide 12","Fall 2023 Q18 & Q28 | Gamal Q12","s"],[87,"2025-E9","e2","Countries such as Italy temporarily delayed or blocked ChatGPT due to technical software bugs rather than ethical, privacy, and minor-protection concerns.",0,"Italy acted over privacy, data-protection and minor-protection concerns. Software bugs were not the reason.","Fall 2023 Q28; Gamal Q18","Fall 2023 Q28 | Gamal Q18","s"],[88,"P1-6","e2","The pressures that sometimes lead engineers to cooperate in wrongdoing, rather than reporting wrongdoing to proper authorities shouldn't be examined.",0,"Preventive ethics says the pressures that lead engineers to go along with wrongdoing should be examined, so wrongdoing is prevented in the first place.","Ethics Lec 2, Slides 12-14","","s"],[89,"P1-9","e2","Reinforcing the connection between ethics and excellence, individuals and corporations should primarily be 'compliance- based,' rather than simply preoccupied with 'value-driven' procedures.",0,"Ethics and excellence go together when people and corporations are driven by values, not only by compliance with rules.","Ethics Lec 2, Slides 12-14","","s"],[90,"P1-10","e2","Moral dilemmas are situations where it is immediately obvious what should be done.",0,"In a moral dilemma, moral reasons conflict and it is not obvious what should be done.","Ethics Lec 2, Slide 21","","st"],[91,"P1-11","e2","Moral values can come into conflict and requiring good judgment about how to reconcile and integrate them.",1,"Moral values can conflict, and resolving that conflict takes good judgment about how to reconcile and integrate them.","Ethics Lec 2","","s"],[92,"P1-24","e2","Promoting responsible conduct is equally important with punishing wrongdoing.",0,"Theme 4 ranks preventing problems above punishing them. Promoting responsible conduct is even MORE important than punishing wrongdoing, so “equally” is false.","Ethics Lec 2, Slide 12","","st"],[93,"P1-28","e2","Reasonable solutions to ethical dilemmas are clear, informed, and well-reasoned.",1,"Reasonable solutions to dilemmas are clear (the values are stated), informed (facts and options are known) and well-reasoned (sound judgment).","Ethics Lec 2, Slides 22-23","","s"],[94,"P1-29","e2","Reasonable solutions to ethical dilemmas are 'informed' which moral values are at stake and how they pertain to the situation.",0,"That describes “clear”. “Informed” means knowing the relevant facts and the available options.","Ethics Lec 2, Slides 22-23","","s"],[95,"P1-45","e2","Engineers share responsibility for creating benefits, preventing harm, and pointing out dangers.",1,"Engineers share responsibility for creating benefits, preventing harm and pointing out dangers.","Ethics Lec 2","","s"],[96,"P1-46","e2","Supporting engineering organizations is part of micro-ethics.",0,"Supporting engineering organizations such as the syndicate is macro-ethics. Micro-ethics is about the decisions of individuals and companies.","Ethics Lec 2, Slide 12; Lec 3-2, Slide 22","","st"],[97,"P1-54","e2","By definition, engineering ethics focus only on the engineer's responsibilities.",0,"Engineering ethics covers rights as well as responsibilities, along with ideals and the understanding and justification of judgments.","Ethics Lec 2, Slide 13","","s"],[98,"P1-56","e2","The silo mentality in an engineering company ensures that every engineer benefits from the experience of other engineers.",0,"Silo mentality traps information inside each department. It prevents engineers from benefiting from each other’s experience.","Ethics Lec 2, Slide 9","","s"],[99,"P1-65","e2","The code of ethics is a very solid criteria which has no limitations.",0,"Codes use general wording, so they have limits. They do not give a ready answer to every dilemma, do not replace individual responsibility, and must be updated.","Ethics Lec 1, Slide 35; Lec 2, Slide 12","","s"],[100,"P1-70","e2","Any engineering project should not be changed with time.",0,"Engineering practice, designs and the rules that guide them must be revisited as technology and society change, so they are expected to change with time.","Ethics Lec 2, Slide 12","","s"],[101,"P1-73","e2","Engineering code of ethics should not be changed with time.",0,"Codes of ethics must be revised over time as technology and society change.","Ethics Lec 1, Slide 35; Lec 2, Slide 12","","s"],[102,"P1-74","e2","The role of engineers towards the engineering syndicate is paying their fees.",0,"Supporting the syndicate is macro-ethics and goes beyond paying fees. It means taking part in its activities.","Ethics Lec 2, Slide 12; Lec 3-2, Slide 22","","s"],[103,"P1-76","e2","Final task in making a product is recycling.",1,"The last stage of a product’s life cycle is recycling and safe disposal (geriatric service).","Ethics Lec 2, Slide 7","","s"],[104,"P1-81","e2","Engineers should not be concerned with how the product of their inventions will be used.",0,"Engineers share responsibility for how their inventions are used, including foreseeable misuse.","Ethics Lec 2","","s"],[105,"P1-1","e2","As an area of inquiry, engineering ethics consists of the responsibilities and rights that ought to be endorsed by those engaged in engineering.",0,"Per the key this wording is false. As an area of inquiry, engineering ethics means understanding moral values, resolving dilemmas and justifying judgments. Responsibilities and rights describe the subject matter itself.","Ethics Lec 2, Slide 13","",""],[106,"P1-2","e2","Engineering ethics consists of the desirable ideals and personal commitments in engineering.",1,"Engineering ethics covers the desirable ideals and personal commitments in engineering.","Ethics Lec 2","",""],[107,"P1-3","e2","Ethics involves duties and dilemmas beside problems and punishment.",1,"Ethics involves duties and dilemmas as well as problems and punishment.","Ethics Lec 2","",""],[108,"P1-5","e2","Compliance issues are about making sure that individuals comply with professional standards and avoid wrongdoing.",1,"Compliance issues are about making sure individuals follow professional standards and avoid wrongdoing.","Ethics Lec 2","",""],[109,"P1-7","e2","Reasonable laws are more essential than government regulation, including penalties for reckless and negligent conduct.",0,"Ethics aims to prevent wrongdoing in the first place and to be driven by values. Laws and penalties for what goes wrong are not what comes first.","Ethics Lec 2, Slides 12-14","",""],[110,"P1-8","e2","Preventive ethics concern about preventing wrongdoing in the last place and aim at preventing moral harm and unnecessary ethical problems.",0,"Preventive ethics prevents wrongdoing in the FIRST place, not in the last place.","Ethics Lec 2, Slides 12-14","","t"],[111,"P1-12","e2","Micro issues concern the decisions made by individuals and companies while Macro issues concern the decisions made by groups such as engineering professional societies and consumer groups.",1,"Micro issues concern decisions by individuals and companies. Macro issues concern decisions by groups such as professional societies and consumer groups.","Ethics Lec 2, Slide 12","",""],[112,"P1-13","e2","Micro issues are more important than macro issues in engineering ethics.",0,"Neither is more important. Micro and macro issues are connected and both matter.","Ethics Lec 2, Slide 12","",""],[113,"P1-14","e2","Morality involves being fair and just, meeting obligations and respecting rights.",1,"Morality involves being fair and just, meeting obligations and respecting rights.","Ethics Lec 2","",""],[114,"P1-16","e2","Obligations are types of actions that are morally mandatory.",1,"Obligations are actions that are morally mandatory.","Ethics Lec 2","",""],[115,"P1-23","e2","Ethics and excellence in engineering go together.",1,"Ethics and excellence in engineering go together.","Ethics Lec 2","",""],[116,"P1-25","e2","Because moral values are myriad and can conflict, ethical dilemmas arise in engineering.",1,"Moral values are many and can conflict, and that is why ethical dilemmas arise in engineering.","Ethics Lec 2","",""],[117,"P1-26","e2","Micro and macro engineering ethics issues are often connected.",1,"Micro and macro engineering ethics issues are often connected.","Ethics Lec 2, Slide 12","",""],[118,"P1-27","e2","Moral dilemmas are situations in which the applications of moral values are unclear, and it is obvious what should be done.",0,"The ending is the trap. In a dilemma the application of values is unclear, and it is NOT obvious what should be done.","Ethics Lec 2, Slide 21","","t"],[119,"P1-30","e2","'Clarity' in reasonable solutions to ethical dilemmas means that good judgment is exercised in integrating the relevant moral values and facts to arrive at a morally desirable solution.",0,"That describes “well-reasoned”. “Clarity” means the moral values at stake are stated clearly.","Ethics Lec 2, Slides 22-23","","t"],[120,"P1-31","e2","Ethical responsibility in ethical dilemmas is to be honest, to the employer, to the public, and also to protect the environment.",1,"In a dilemma the ethical responsibility is to be honest with the employer and the public and to protect the environment.","Ethics Lec 2","",""],[121,"P1-32","e2","Obtain relevant information and consider all options are necessary through solving ethical dilemmas.",1,"Solving a dilemma needs relevant information and consideration of all the options.","Ethics Lec 2","",""],[122,"P1-33","e2","Often a code of ethics always provides a straightforward solution to dilemmas.",0,"Codes are general and vague, so they do not always give a straightforward answer to a dilemma.","Ethics Lec 1, Slide 35; Lec 2, Slide 12","",""],[123,"P1-35","e2","Some dilemmas have two or more solutions and no one of which is mandatory.",1,"As in engineering design, a dilemma often has several acceptable solutions, none mandatory. They differ in being better or worse, not simply right or wrong.","Ethics Lec 2, Slides 25-26","",""],[124,"P1-36","e2","Engineering design often involves uncertainties and ambiguities about the specific problems that will arise as solutions are developed.",1,"Engineering design involves uncertainty and ambiguity about the problems that will arise as solutions are developed.","Ethics Lec 2","",""],[125,"P1-37","e2","Codes of ethics state the moral responsibilities of profession as seen by the engineers.",0,"Wording swapped. A code states the moral responsibilities of engineers as seen by the profession as a whole.","Ethics Lec 1, Slide 35; Lec 2, Slide 12","",""],[126,"P1-38","e2","Codes are a substitute for individual responsibility in grappling with concrete dilemmas.",0,"Codes never replace individual responsibility when facing a concrete dilemma.","Ethics Lec 1, Slide 35; Lec 2, Slide 12","",""],[127,"P1-39","e2","Codes are restricted to general wording, and hence inevitably contain substantial areas of vagueness.",1,"Codes are limited to general wording, so they inevitably contain areas of vagueness.","Ethics Lec 2","",""],[128,"P1-40","e2","Reasonable solutions to ethical dilemmas are informed about both facts and options.",1,"Reasonable solutions to dilemmas are informed about both the facts and the options.","Ethics Lec 2, Slides 22-23","",""],[129,"P1-41","e2","Moral choice doesn't involve alternative permissible solutions to dilemmas with dynamic processes involving series of problems.",0,"Moral choice often involves several permissible alternatives in a dynamic series of problems, so the statement is false.","Ethics Lec 2, Slides 25-26","",""],[130,"P1-42","e2","Serving and protecting the public, providing guidance, offering inspiration, establishing shared standards, contributing to education, deterring wrongdoing, and strengthening a profession's image are the limitations of codes of ethics.",0,"Those are the benefits and functions of codes. The limitations are vagueness, no ready answer to every dilemma, and no replacement for individual responsibility.","Ethics Lec 1, Slide 35; Lec 2, Slide 12","",""],[131,"P1-43","e2","Ethical subjectivism is the view that actions are morally right within a particular society when, and only because, they are approved by law, custom, or other conventions of that society.",0,"That is Ethical Relativism, which ties morality to law and custom. Ethical Subjectivism ties it to personal feelings.","Ethics Lec 2, Slide 20","","t"],[132,"P1-44","e2","The view that moral judgments merely express feelings and attitudes, not beliefs that can be justified or unjustified by appeal to moral reasons is called ethical subjectivism.",1,"Ethical subjectivism says moral judgments merely express personal feelings and attitudes, not beliefs that can be justified by moral reasons.","Ethics Lec 2, Slide 20","",""],[133,"P1-63","e2","To solve a dilemma, it is enough for an engineer to have a little info about the situation.",0,"Solving a dilemma needs relevant information and consideration of all options. A little information is not enough.","Ethics Lec 2","",""],[134,"2014-12","e2","Engineers face ethical problems only in the implementation phase of their products.",0,"Ethical problems arise at every stage of the life cycle, not only in implementation.","Ethics Lec 2","",""],[135,"2014-13","e2","The growth of corporations necessitates high demand on engineers.",1,"As corporations grow, the demand for engineers grows with them.","Ethics Lec 2","",""],[136,"2014-15","e2","An engineer can completely avoid ethical dilemmas throughout his entire career.",0,"Dilemmas are unavoidable because moral values are many and can conflict, so no engineer can avoid them for an entire career.","Ethics Lec 2","",""],[137,"2014-16","e2","Stakeholder theory means increasing the profit of stockholders.",0,"Stakeholder theory says a company owes responsibilities to every group with a vital stake in it, such as employees, customers and communities, not only stockholders.","Ethics Lec 2, Slide 19","","t"],[138,"2014-26","e2","Some activities like annual meetings and regular seminars in an engineering company ensure that every engineer benefits from the experience of other engineers.",1,"Annual meetings and regular seminars share experience between engineers and fight the silo mentality.","Ethics Lec 2, Slide 9; Lec 3-1, Slide 12","",""],[139,"2014-28","e2","The design of an engineering product needs to be flexible to accommodate any needed changes during manufacturing.",1,"A product design should be flexible enough to accommodate needed changes during manufacturing.","Ethics Lec 2","",""],[140,"2014-29","e2","Ethically, if there is a false advertisement of an engineering product, only the sales department should be held responsible for it, not the engineer who developed the product.",0,"Ethical responsibility is shared. An engineer who stays silent about false advertising shares the responsibility with the sales department.","Fall 2023 Q31; Spring 2019 Q15; Ethics Lec 2, Slide 8","","t"],[141,"2014-30","e2","Adhering to an engineering code of ethics would usually promote a good image of the engineering profession.",1,"Following an engineering code of ethics usually promotes a good image of the profession.","Ethics Lec 2","",""],[142,"2014-31","e2","Relying on handbooks and computer programs only would ensure that the engineering design is a good one.",0,"Relying only on handbooks and software, without understanding their limits, does not guarantee a good design.","Ethics Lec 2, Slide 7; Lec 3-1, Slide 7","",""],[143,"2014-32","e2","Supporting engineering organizations is part of macro-ethics.",1,"Supporting engineering organizations is part of macro-ethics.","Ethics Lec 2, Slide 12; Lec 3-2, Slide 22","",""],[144,"2014-56","e2","The final task in any engineering product is maintenance.",0,"Maintenance is not the last task. Recycling and safe disposal come after it.","Mid 1 2025 Q19; Ethics Lec 2, Slide 7","","t"],[145,"2014-57","e2","Prototype testing of an engineering product should be done in all possible environments, not just the favorable environment.",1,"Prototype testing should cover all possible environments, not just the favorable one.","Ethics Lec 2, Slide 7","",""],[146,"2014-58","e2","Production managers should not be assigned quality control assignments.",1,"A production manager should not also be the quality control manager. Production targets conflict with rejecting defective output.","Mid 1 2025 Q18; Spring 2019 Q14; Ethics Lec 2, Slide 8","","t"],[147,"2014-61","e2","Ethical dilemmas are situations in which moral reasons come into conflict, or in which the application of moral values is problematic, and it is not immediately obvious what should be done.",1,"In a dilemma moral reasons conflict, or the application of values is problematic, and it is not immediately obvious what should be done.","Ethics Lec 2, Slide 21","",""],[148,"2014-62","e2","Stakeholder theory means that corporations have responsibilities to all groups that have a vital stake in the corporation, including employees, customers, dealers, suppliers, local communities, and the general public.",1,"Stakeholder theory means a corporation has responsibilities to every group with a vital stake in it: employees, customers, dealers, suppliers, local communities and the public.","Ethics Lec 2, Slide 19","",""],[149,"2014-63","e2","Micro-ethical issues concern the general direction of technological developments and collective responsibilities of engineers, engineering professional societies, and industrial associations.",0,"That describes macro-ethics. Micro-ethics is about the decisions of individuals and companies.","Ethics Lec 2, Slide 12; Lec 3-2, Slide 22","","t"],[150,"2014-64","e2","Most ethical dilemmas have solutions that are either (right or wrong), not (better or worse).",0,"Dilemma solutions usually differ in being better or worse, like design alternatives, rather than simply right or wrong.","Ethics Lec 2, Slides 25-26","",""],[151,"2014-65","e2","Moral relativism means that actions are morally right within a particular society when, and only because, they are approved by law, custom, or other conventions of that society.",1,"This is the definition of ethical relativism: actions are right within a society because law, custom or convention approves them.","Ethics Lec 2, Slide 20","",""],[152,"2014-66","e2","When dealing with an ethical dilemma, it is better if we can explain our decisions to others. This makes our decision well- reasoned.",1,"Being able to explain a decision to others makes the decision well-reasoned.","Ethics Lec 2, Slides 22-23","",""],[153,"2014-67","e2","Moral communication is the precision in the use of a common ethical language. It is also a skill needed to express and support one's moral views adequately to others.",1,"Moral communication is the precise use of a common ethical language and the skill of supporting one’s views to others.","Ethics Lec 2","",""],[154,"2014-68","e2","Moral awareness is the proficiency in recognizing moral issues and problems in engineering.",1,"Moral awareness is the skill of recognizing moral issues and problems in engineering.","Ethics Lec 2","",""],[155,"2014-69","e2","Convincing moral reasoning is comprehending, clarifying, and assessing arguments on opposing sides of moral issues.",1,"Convincing moral reasoning means comprehending, clarifying and assessing arguments on opposing sides of a moral issue.","Ethics Lec 2","",""],[156,"2013-25","e2","Supporting engineering syndicates is part of macro-ethics.",1,"Supporting engineering syndicates is part of macro-ethics.","Ethics Lec 2, Slide 12; Lec 3-2, Slide 22","",""],[157,"2013-29","e2","By definition, engineering ethics focus only on the engineer's responsibilities.",0,"Engineering ethics covers rights as well as responsibilities, so “only” makes this false.","Ethics Lec 2, Slide 13","",""],[158,"2013-30","e2","It is not the responsibility of the engineers to be concerned with how the product of their inventions will be used.",0,"Engineers share responsibility for how the product of their inventions will be used.","Ethics Lec 2","",""],[159,"2013-31","e2","Annual meetings and regular seminars in an engineering company ensure that every engineer benefits from the experience of other engineers.",1,"Annual meetings and regular seminars share experience across the company and fight the silo mentality.","Ethics Lec 2, Slide 9; Lec 3-1, Slide 12","",""],[160,"2013-37","e2","Punishing wrongdoings is even more important than promoting responsible conduct.",0,"Reversed. Theme 4 says promoting responsible conduct is even more important than punishing wrongdoing.","Ethics Lec 2, Slide 12","","t"],[161,"2013-38","e2","Corporations have responsibilities only to those groups that have a vital role in their profits.",0,"Under stakeholder theory a corporation has responsibilities to every group with a vital stake, not only the groups that make its profit.","Ethics Lec 2, Slide 19","",""],[162,"2025-E10","e31","An alert engineer must continually challenge existing safety conditions and maintain a questioning attitude, even if doing so takes extra time.",1,"An alert engineer keeps challenging existing safety conditions and keeps a questioning attitude, even when it takes extra time.","Fall 2023 Q9; Gamal Q25","Fall 2023 Q9 | Gamal Q25","s"],[163,"2025-E11","e31","Documenting lessons learned is the final (end) process of Knowledge Management (KM) in an engineering organization.",0,"Documenting lessons learned is the beginning of knowledge management, not the end. The lessons must then be shared, standards updated and the lessons applied.","Fall 2023 Q4; Gamal Q32, Q35","Fall 2023 Q4 | Gamal Q32 & Q35","st"],[164,"2025-E12","e31","According to the ETH Zurich study of 800 structural failures (504 killed), the #1 human cause of engineering failure is insufficient knowledge (36%), followed by underestimation of influence (16%). [Lec 3-1 Slide 14]",1,"In the ETH Zurich study of 800 structural failures (504 killed), the top human cause was insufficient knowledge (36%), followed by underestimation of influence (16%).","Ethics Lec 3-1, Slide 14","","s"],[165,"2025-E13","e31","For valid informed consent in social experimentation, information must be widely publicized/disseminated to the general public, NOT restricted to a small group of specialists, and consent can NEVER be bypassed for urgency.",1,"Valid informed consent needs information to be widely disseminated to the public, not limited to a few specialists, and it can never be bypassed because of urgency.","Mid 1 2025 Q7; Fall 2023 Q10, Q11","Mid 1 2025 Q7 | Fall 2023 Q10 & Q11","s"],[166,"2025-E14","e31","Elected representatives and specialized Non-Governmental Organizations (NGOs) can and do help the public monitor complex engineering projects.",1,"Elected representatives and NGOs can help the public monitor complex engineering projects.","Fall 2023 Q5; Gamal Q26","Fall 2023 Q5 | Gamal Q26","s"],[167,"2025-E15","e31","The concept of an 'Intelligent Customer' (who understands requirements, supervises contractor work, and technically reviews output) applies to an individual person rather than the engineering organization.",0,"An intelligent customer is an organizational capability, not an individual one.","Spring 2019 Q27-28; Fall 2023 Q2","Spring 2019 Q27–28 | Fall 2023 Q2","st"],[168,"P1-47","e31","Professional competence means: the will to submit one's actions to moral inspection and be open and responsive to the assessments of others.",0,"That defines accountability, not competence. Competence is mastery of technical skill.","Mid 1 2025 Q11; Ethics Lec 3-1, Slide 20","","st"],[169,"P1-48","e31","It is much easier to hold an engineer responsible for a design problem if he is working in a company more than if he is working as an individual engineer.",0,"Responsibility is harder to assign inside a large company because work is fragmented and responsibility is diffused.","Mid 1 2025 Q6, Q10; Ethics Lec 3-1, Slide 20","","st"],[170,"P1-57","e31","An individual engineer is much easier to behave ethically than another engineer who is working in a company.",1,"An individual engineer is easier to hold accountable, and has more personal control, than one inside a large company where responsibility is diffused.","Mid 1 2025 Q6, Q10; Ethics Lec 3-1, Slide 20","","s"],[171,"P1-75","e31","An engineer should inform the local community of a certain project about the expected side effects.",1,"Informed consent requires telling the local community about the expected side effects and risks of a project.","Ethics Lec 3-1, Slide 16","","s"],[172,"P1-77","e31","Managers pressure their employees to assess the impact of a certain project before moving to a new one.",0,"Corrected key: False. Managers usually pressure engineers to move quickly to a new project without assessing the impact of the current one.","Ethics Lec 3-1, Slide 20","","t"],[173,"S3-1","e31","Each engineering project taken as a whole may be viewed as an experiment.",1,"Each engineering project as a whole may be viewed as an experiment.","Ethics Lec 3-1","",""],[174,"S3-3","e31","Any project is carried out in partial ignorance is one of several features of virtually every kind of engineering practice that combine to make it appropriate to view engineering projects as experiments.",1,"Partial ignorance is one of the features of engineering practice that makes it appropriate to view projects as experiments.","Ethics Lec 3-1","",""],[175,"S3-4","e31","Engineering differs in the experimental control respect from standard experimentation because the experimental subjects are human beings or finished and sold products that receive the special, experimental treatment.",0,"The reason given is wrongly worded. Engineering differs from lab experiments because it happens in the open real world, without full experimental control.","Sheet 3 Q4; Ethics Lec 3-1, Slide 15","",""],[176,"S3-5","e31","Engineering projects are experiments that are designed to produce very much knowledge.",0,"The main goal of an engineering project is to deliver a useful product to the public. Gaining knowledge is a by-product, not the main aim.","Sheet 3 Q5; Ethics Lec 3-1, Slide 15","",""],[177,"S3-6","e31","The normal design process is thus iterative, carried out on trial designs with modifications being made on the basis of feedback information acquired from tests.",1,"The normal design process is iterative: trial designs are tested and modified based on feedback.","Ethics Lec 3-1","",""],[178,"S3-7","e31","One of the respects of the concept of a properly conducted experiment involving human subjects is that human subjects should be given only the information they request.",0,"Subjects must be given full disclosure of the risks and alternatives, not only the information they happen to request.","Sheet 3 Q7; Ethics Lec 3-1, Slide 16","","t"],[179,"S3-8","e31","When we carry out an engineering activity as if it were an experiment, we are primarily preparing ourselves for unexpected outcomes.",1,"Treating engineering as an experiment mainly prepares us for unexpected outcomes.","Ethics Lec 3-1","",""],[180,"S3-9","e31","From the perspective of engineering as social experimentation, four features characterize what it means to be a responsible person while acting as an engineer, such as a comprehensive perspective and moral autonomy.",1,"Engineering as social experimentation involves features such as a comprehensive perspective and moral autonomy that characterize a responsible engineer.","Ethics Lec 3-1","",""],[181,"S3-10","e31","Responsible people accept moral responsibility for their actions because of a strong psychological tendency in people to be willing to abandon personal accountability when placed under authority.",1,"People have a tendency to hand over their judgment to authority. A responsible engineer has to resist that and keep accepting personal responsibility.","Ethics Lec 3-1","",""],[182,"S3-11","e31","Engineering as social experimentation can provide engineers with a proper perspective on laws and regulations in that rules that govern engineering practice should be devised or construed as rules of responsible experimentation.",1,"Seeing engineering as social experimentation means practice rules should be treated as rules of responsible experimentation.","Ethics Lec 3-1","",""],[183,"S3-15","e31","Informed consent to the use or effects of products is given Obligatory.",0,"Informed consent must be voluntary, not obligatory.","Sheet 3 Q15; Ethics Lec 3-1, Slide 16","","t"],[184,"2014-24","e31","If we are in a hurry to develop an engineering product, we can test it in the market [instead of lab testing].",0,"Never skip lab and prototype testing. Testing a product on the public in the market because of hurry is unethical.","Ethics Lec 2, Slide 7; Lec 3-1, Slide 5","",""],[185,"2013-26","e31","Professional competence means: Being willing to submit one's actions to moral inspection and be open and responsive to the assessments of others.",0,"That defines accountability, not competence. Competence is mastery of technical skill.","Mid 1 2025 Q11; Ethics Lec 3-1, Slide 20","","t"],[186,"2013-32","e31","Nowadays, it is more important to focus on the corporation's ethical practices than the engineers' ethical practices.",0,"Neither is more important. Corporate ethics and engineers’ ethics both matter, and an engineer stays responsible for his own conduct.","Ethics Lec 3-1","",""],[187,"2025-E16","e32","The crashes of Boeing 737 MAX aircraft resulted from a triple failure of the technology vendor, the national engineering company (Boeing), AND the national regulator (FAA) due to self-regulation conflict of interest.",1,"The Boeing 737 MAX crashes were a triple failure: the technology vendor, Boeing itself, and the FAA regulator, which let Boeing self-certify. That is a conflict of interest.","Fall 2023 Q8; Gamal Q29; Ethics Lec 3-2, Slides 3-8","Fall 2023 Q8 | Gamal Q29","s"],[188,"2025-E17","e32","In the Challenger space shuttle disaster, O-ring specialist Roger Boisjoly was NOT considered a whistleblower the night before launch because he only objected inside his normal chain of command rather than going outside channels.",1,"Before the launch Boisjoly only objected inside his normal chain of command. He did not go outside to someone who could stop it, so he was not yet a whistleblower.","Gamal Q40; Ethics Lec 3-2, Slide 14","Gamal Q40","st"],[189,"2025-E18","e32","NASA rushed the Challenger launch to gain an advantage over foreign national competitors, and obtained valid informed consent from the astronauts before launch.",0,"NASA rushed Challenger because of internal schedule and political pressure, and the astronauts were never told about the O-ring warnings, so there was no informed consent.","Gamal Q7, Q20; Ethics Lec 3-1 and 3-2","Gamal Q7 & Q20","s"],[190,"2025-E19","e32","Whistleblowers must ALWAYS keep their immediate supervisors informed of their actions, even when the supervisor is the source of the cover-up or when going external after internal channels failed.",0,"Not when the supervisor is the source of the cover-up or when you go outside after internal channels failed. Keeping him informed is not always required.","Mid 1 2025 Q29; Ethics Lec 3-2, Slide 18","Mid 1 2025 Q29","st"],[191,"P1-62","e32","Engineers can participate in some issues involving conflict of interest.",0,"Engineers must avoid conflicts of interest, or fully disclose any that cannot be avoided. Joining them freely is not allowed.","Ethics Lec 3-2, Slides 3-8","","s"],[192,"S5-10","e32","Confidentiality is the duty to keep secret all information deemed desirable to keep secret [by the employer/client].",1,"Confidentiality is the duty to keep secret information that the employer or client wants kept secret.","Mid 1 2025 Q25; Ethics Lec 3-2, Slides 9-12","",""],[193,"S5-11","e32","The obligation to protect confidential information ceases when employees change jobs.",0,"The duty to protect confidential information continues after an employee changes jobs.","Mid 1 2025 Q25; Ethics Lec 3-2, Slides 9-12","",""],[194,"S5-12","e32","Whistleblowing occurs when an employee or former employee conveys information about a significant moral problem to someone in a position to take action on the problem, and does so outside approved organizational channels (or against strong pressure).",1,"This is the definition of whistleblowing: conveying information about a significant moral problem to someone able to act, outside approved channels or against pressure.","Mid 1 2025 Q26; Ethics Lec 3-2, Slide 14","",""],[195,"2014-1","e32","Some conflicts of interest are unavoidable or even acceptable, like in the aviation industry.",1,"Some conflicts of interest are unavoidable or acceptable, as when industry experts regulate their own industry in aviation.","Mid 1 2025 Q24; Ethics Lec 3-2, Slides 3-8","",""],[196,"2014-33","e32","Whistleblowing occurs when a former employee conveys information about a significant moral problem to someone in a position to take action on the problem, and does so outside approved organizational channels (or against strong pressure).",1,"This is the standard definition of whistleblowing, and it covers former employees as well as current ones.","Mid 1 2025 Q26; Ethics Lec 3-2, Slides 14-23","",""],[197,"2014-34","e32","Whistleblowing is officially [always] obligatory.",0,"Whistleblowing is not always obligatory. First confirm the evidence and try internal channels.","Ethics Lec 3-2, Slide 18","","t"],[198,"2014-35","e32","If there is a doubt that environmental damage occurs from a certain factory, employees have to directly whistleblow the issue.",0,"A doubt is not enough. Confirm the evidence and use internal channels first before whistleblowing.","Ethics Lec 3-2, Slide 18","","t"],[199,"2014-36","e32","The public have a responsibility to protect whistleblowers.",1,"The public should protect whistleblowers, since they take personal risk to protect others.","Mid 1 2025 Q26; Ethics Lec 3-2, Slides 14-23","",""],[200,"2014-37","e32","Being considerate of the feelings of others involved contradicts the essence of whistleblowing.",0,"Whistleblowers should be tactful and stick to the issues rather than personal attacks, so being considerate does not contradict whistleblowing.","Ethics Lec 3-2, Slides 14-23","",""],[201,"2014-38","e32","Working through normal organizational channels contradicts the essence of whistleblowing.",0,"Using normal channels first is one of the recommended rules, so it does not contradict whistleblowing.","Ethics Lec 3-2, Slides 14-23","",""],[202,"2014-39","e32","It is better if the employee waits till he leaves his company to whistleblow. Thus, he will avoid being harmed by the organization's top management.",0,"Rule 2 is to be prompt. Waiting until you leave lets the harm happen.","Ethics Lec 3-2, Slide 20","","t"],[203,"2014-40","e32","Before whistleblowing, it is better if the employee keeps a formal record of his communications with his superiors regarding the issue under consideration.",1,"Keeping a formal record of communications with superiors is one of the recommended rules before whistleblowing.","Ethics Lec 3-2, Slides 14-23","",""],[204,"2014-41","e32","Religious commitment cannot be a motive for whistleblowing.",0,"Moral and religious commitment can motivate whistleblowing.","Ethics Lec 3-2, Slides 14-23","",""],[205,"2014-42","e32","Confidentiality means keeping secret the information specified by an employer or client in order to compete effectively against business rivals, especially proprietary information and trade secrets (owned by a company) but also privileged information concerning a project.",1,"Confidentiality means keeping secret what the employer or client specifies, especially proprietary information and trade secrets, in order to compete.","Mid 1 2025 Q25; Ethics Lec 3-2, Slides 9-12","",""],[206,"2014-43","e32","Confidentiality in engineering corporations is good for the public since investment in development would be protected and encouraged.",1,"Confidentiality protects investment in development, which encourages innovation and benefits the public.","Mid 1 2025 Q25; Ethics Lec 3-2, Slides 9-12","",""],[207,"2014-44","e32","Confidentiality in engineering corporations should not be used to hide misdeeds.",1,"Confidentiality protects legitimate secrets. It must never be used to hide misdeeds, crimes or hazards.","Mid 1 2025 Q25; Ethics Lec 3-2, Slides 9-12","",""],[208,"2014-45","e32","Conflict of interest means a situation where professionals or other employees have an interest that, if pursued, might keep them from meeting their obligations to their employers or clients.",1,"A conflict of interest is an interest that, if pursued, might keep a professional from meeting obligations to an
